<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script>
    // ===== Firebase 설정 (앱 시작 시 가장 먼저 적용) =====
    // 이미지: ImgBB API (https://api.imgbb.com/ 에서 발급한 키를 아래에 입력)
    const IMGBB_KEY = '6d579e8af35437caa5c39b09f7934fd2';
    // 메인 서버: 유저, 카테고리, 채팅방, 메시지 (이미지는 ImgBB에 올리고 URL만 저장)
    const CFG_MAIN = { apiKey: "AIzaSyDp6gO-g1is11kBGdYL8Ay9OyEbp6IslpQ", authDomain: "robloxdiscordsure-victory-unit.firebaseapp.com", projectId: "robloxdiscordsure-victory-unit", storageBucket: "robloxdiscordsure-victory-unit.firebasestorage.app", messagingSenderId: "485777523197", appId: "1:485777523197:web:642f63a4ae95ed97b7d994" };

    const $ = s => {
        return document.querySelector(s);
    };
    const esc = s => {
        return String(s ?? '').replace(/[&<>"']/g, c => {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]);
        });
    };
    const today = () => {
        return new Date().toLocaleDateString('sv');
    };
    const RANK = { decor: 0, member: 1, admin: 2, manager: 3, owner: 4 };
    const RN = { decor: '장식', member: '멤버', admin: '관리자', manager: '매니저', owner: '소유자' };
    const RC = { decor: '#7a5fc0', member: '#4e5058', admin: '#2d9d5b', manager: '#c9382f', owner: '#e6a117' };
    const NF = 'pixilart-drawing.png';
    let db;
    let roles = [];
    let me;
    let users = {};
    let cats = [];
    let chans = [];
    let msgs = [];
    let cur = localStorage.cur || null;
    let unread = {};
    let sound = localStorage.snd !== '0';
    let first = true;
    let mem = {};
    let lastDay = today();
    let started = false;
    const OWNER = 'windo6k66';
    const ro = u => {
        return u?.nick?.toLowerCase() === OWNER ? 'owner' : (roles.find(x => {
            return x.id === u?.roleId;
        })?.level || (u?.role in RANK && u.role !== 'owner' ? u.role : 'member'));
    };
    const rinfo = u => { if (ro(u) === 'owner') {
        return { name: RN.owner, color: RC.owner };
    } const x = roles.find(x => {
        return x.id === u?.roleId;
    }); if (x) {
        return x;
    } const l = ro(u); return { name: RN[l], color: RC[l] }; };
    const rank = u => {
        return RANK[ro(u)];
    };
    // ---- 채널 권한: 역할 키 = 커스텀 역할 id 또는 '_member' 등 기본 등급. 관리자 이상은 항상 가능 ----
    const rk = u => { const x = roles.find(r => r.id === u?.roleId); return x ? x.id : '_' + ro(u); };
    const canView = (u, c) => !c ? false : (rank(u) >= 2 || c.viewAll !== false || (c.viewRoles || []).includes(rk(u)));
    const canPost = (u, c) => !c ? false : canView(u, c) && (rank(u) >= 2 || c.sendAll !== false || (c.sendRoles || []).includes(rk(u)));
    const vchans = () => chans.filter(c => canView(me, c));
    let rolesLoaded = false;
    let chansLoaded = false;
    const toast = t => { const d = document.createElement('div'); d.className = 'ts'; d.textContent = t; document.body.append(d); setTimeout(() => {
        return d.remove();
    }, 2500); };
    const av = (u, s) => {
        return u.avatar ? `<img class=av style="width:${s}px;height:${s}px" src="${u.avatar}">` : `<span class=av style="width:${s}px;height:${s}px;background:hsl(${[...u.nick].reduce((a, c) => {
            return a + c.charCodeAt(0) * 7;
        }, 0) % 360},50%,45%);font-size:${s * .45}px">${esc([...u.nick][0])}</span>`;
    };
    const dn = u => {
        return u.alias || u.nick;
    };
    const pun = u => { const p = u?.punish; return p && (p.until === 0 || p.until > Date.now()) ? p : null; };
    const isOn = u => {
        return u.online && Date.now() - (u.seen || 0) < 90000;
    };
    // ---- 알림음 ----
    let ac;

    function ding() { if (!sound) {
        return;
    } try {
        ac = ac || new (window.AudioContext || webkitAudioContext)();
        [880, 1175].forEach((f, i) => { const o = ac.createOscillator(); const g = ac.createGain(); const t = ac.currentTime + i * .14; o.frequency.value = f; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.001, t + .35); o.start(t); o.stop(t + .35); });
    }
    catch { } }
    // ---- 이미지 ----

    function shrink(file, maxH, q, sq) { return new Promise((ok, no) => { const i = new Image(); i.onload = () => { const c = document.createElement('canvas'); const x = c.getContext('2d'); if (sq) {
        c.width = c.height = maxH;
        const m = Math.min(i.width, i.height);
        x.drawImage(i, (i.width - m) / 2, (i.height - m) / 2, m, m, 0, 0, maxH, maxH);
    }
    else {
        const s = Math.min(1, maxH / i.height);
        c.width = Math.round(i.width * s);
        c.height = Math.round(i.height * s);
        x.drawImage(i, 0, 0, c.width, c.height);
    } ok(c.toDataURL('image/jpeg', q)); }; i.onerror = no; i.src = URL.createObjectURL(file); }); }
    // ---- 이미지 (ImgBB) ----
    async function uploadImg(file) {
        if (!IMGBB_KEY || IMGBB_KEY === 'YOUR_IMGBB_API_KEY') { throw { code: 'no-key', message: 'ImgBB API 키가 설정되지 않았습니다' }; }
        const claim = await uniqueName(file.name || 'image.png');
        try {
            const fd = new FormData();
            fd.append('image', file);
            // 확장자를 뺀 이름을 ImgBB에 전달 (예: "1(1)")
            fd.append('name', claim.name.replace(/\.[^.]*$/, ''));
            const r = await fetch('https://api.imgbb.com/1/upload?key=' + encodeURIComponent(IMGBB_KEY), { method: 'POST', body: fd });
            let j = null;
            try { j = await r.json(); } catch { }
            if (!r.ok || !j?.success) { throw { code: 'imgbb-' + r.status, message: j?.error?.message || ('HTTP ' + r.status) }; }
            return j.data.display_url || j.data.url;
        }
        catch (e) {
            // 업로드 실패 시 예약한 이름을 되돌려 번호가 낭비되지 않게 함
            claim.ref.delete().catch(() => { });
            throw e;
        }
    }
    // ---- 중복 파일명 처리: 1.png → 1(1).png → 1(2).png ----
    // 'imgnames' 컬렉션에 업로드된 파일명을 기록하고, 트랜잭션으로 겹치지 않는 이름을 확보
    async function uniqueName(fn) {
        const m = fn.match(/^(.*?)(\.[^.]*)?$/);
        const base = m[1] || 'image';
        const ext = m[2] || '';
        for (let i = 0; i < 1000; i++) {
            const name = i ? `${base}(${i})${ext}` : base + ext;
            const ref = db.collection('imgnames').doc('i_' + encodeURIComponent(name.toLowerCase()).replace(/\./g, '%2E'));
            try {
                await db.runTransaction(async (t) => {
                    const d = await t.get(ref);
                    if (d.exists) { throw new Error('dup'); }
                    t.set(ref, { name, ts: Date.now() });
                });
                return { name, ref };
            }
            catch (e) {
                if (e.message !== 'dup') { throw e; }
            }
        }
        throw { code: 'no-name', message: '사용 가능한 파일 이름을 찾지 못했습니다' };
    }
    // ---- 저장 공간 부족 시 가장 오래된 메시지부터 10개씩 삭제 후 재시도 ----
    async function prune() {
        const s = await db.collection('msgs').orderBy('ts').limit(10).get();
        if (s.empty) {
            return 0;
        }
        const b = db.batch();
        s.forEach(d => {
            return b.delete(d.ref);
        });
        await b.commit();
        return s.size;
    }

    async function safeAdd(col, data) {
        let removed = 0;
        for (let i = 0; i < 20; i++) {
            try {
                const r = await db.collection(col).add(data);
                if (removed) {
                    toast(`저장 공간 부족: 오래된 메시지 ${removed}개를 삭제했습니다`);
                }
                return r;
            }
            catch (e) {
                if (e.code !== 'resource-exhausted') {
                    throw e;
                }
                const n = await prune();
                if (!n) {
                    throw e;
                }
                removed += n;
            }
        }
        return await db.collection(col).add(data);
    }
    // ---- 비밀번호 해시 (SHA-256 + 유저별 솔트) ----
    const newSalt = () => {
        return [...crypto.getRandomValues(new Uint8Array(16))].map(x => {
            return x.toString(16).padStart(2, '0');
        }).join('');
    };

    async function hpw(pw, salt) {
        const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pw));
        return [...new Uint8Array(b)].map(x => {
            return x.toString(16).padStart(2, '0');
        }).join('');
    }
    // ---- 닉네임 서버 등록 (nicks 컬렉션: 문서ID=소문자 닉네임, 트랜잭션으로 중복 방지) ----
    const nk = n => {
        return 'n_' + encodeURIComponent(n.toLowerCase()).replace(/\./g, '%2E');
    };

    async function claimNick(n, uid, old) { const ref = db.collection('nicks').doc(nk(n)); await db.runTransaction(async (t) => { const d = await t.get(ref); if (d.exists && d.data().uid !== uid) {
        throw new Error('dup');
    } t.set(ref, { nick: n, uid, ts: Date.now() }); if (old && old.toLowerCase() !== n.toLowerCase()) {
        t.delete(db.collection('nicks').doc(nk(old)));
    } }); }
    // ---- 시작 ----

    function setup() { $('#app').innerHTML = `<div class=full><div><h2>Firebase 설정</h2><p>Firebase 콘솔 > 프로젝트 설정의 firebaseConfig 객체를 붙여넣으세요.</p><textarea id=cfg rows=8 placeholder='{apiKey:"...",projectId:"..."}'></textarea><button id=cfgok>저장</button></div></div>`; $('#cfgok').onclick = () => { try {

    }
    catch {
        toast('설정 형식이 올바르지 않습니다');
    } }; }

    function boot() { const FS = { experimentalForceLongPolling: true, useFetchStreams: false }; db = firebase.initializeApp(CFG_MAIN, 'main').firestore(); db.settings(FS); const go = () => { const u = localStorage.uid; if (!u) {
        return loginUI();
    } db.collection('users').doc(u).get().then(d => { if (d.exists) {
        claimNick(d.data().nick, d.id).catch(() => { });

    }
    else {

    } }).catch(() => { toast('연결 오류, 재시도 중…'); setTimeout(go, 3000); }); }; go(); }

    function loginUI(mode) {
        const isNew = mode === 'new';
        const keep = $('#ln')?.value;
        $('#app').innerHTML = `<div class=full><div><h2>👋 커뮤니티</h2>
        <div style="display:flex;gap:6px"><button class="${isNew ? '' : 'g'}" data-lm=new style="flex:1">새 계정 만들기</button><button class="${isNew ? 'g' : ''}" data-lm=login style="flex:1">로그인</button></div>
        <input id=ln placeholder="${isNew ? '닉네임 (고유 ID · 공백 불가 · 멘션에 사용)' : '닉네임'}" maxlength=20>
        ${isNew ? '<input id=ld placeholder="표시 닉네임 (채팅에 보이는 이름, 비우면 닉네임)" maxlength=30>' : ''}
        <input id=lp type=password placeholder="비밀번호 (4자 이상)" maxlength=64>
        ${isNew ? '<input id=lp2 type=password placeholder="비밀번호 확인" maxlength=64>' : ''}
        <button id=lok>${isNew ? '계정 만들기' : '로그인'}</button>
        <div style="font-size:12px;color:#949ba4">${isNew ? '이미 사용 중인 닉네임으로는 만들 수 없습니다. 비밀번호는 최초 1회 등록되며, 변경은 프로필에서 기존 비밀번호를 입력해야 가능합니다.' : '이미 만들어진 계정의 닉네임과 비밀번호로 접속합니다. 비밀번호가 아직 없는 예전 계정은 지금 입력한 비밀번호가 등록됩니다.'}</div></div></div>`;
        $('#ln').value = keep ?? (isNew ? '' : (localStorage.lastNick || ''));
        document.querySelectorAll('[data-lm]').forEach(b => {

    // ---- 비밀번호가 없는 기존 계정으로 이미 접속 중인 경우: 등록 전까지 사용 불가 ----

    <div class=main><div class=top><button class=ib id=mb data-a=side>☰</button><span id=cn style="word-break:break-all"></span><span style=flex:1></span><button class=ib id=mm data-a=mem>👥</button></div><div id=ml class=ml></div><div id=sg class=sg></div>
    <div class=cb><button class=g data-a=upl>＋</button><input id=ip placeholder="메시지 입력 (@닉네임 으로 멘션)" autocomplete=off><button data-a=send>전송</button><input type=file id=fi accept="image/*" hidden></div></div><div id=R class=mem></div>`;

            s.docChanges().forEach(c => {

                    return;
                }
                const m = { id: c.doc.id, ...c.doc.data() };
                if (first || m.uid === me.id) {
                    return;
                }
                if (!canView(me, chans.find(x => { return x.id === m.ch; }))) {
                    return;
                }
                if (m.mentions?.includes(me.id)) {
                    ding();
                    unread[m.ch] = (unread[m.ch] || 0) + (m.ch !== cur ? 1 : 0);
                    if (Notification?.permission === 'granted' && (document.hidden || m.ch !== cur)) {
                        try {
                            new Notification(dn(users[m.uid] || { nick: '?', alias: '' }) + '님이 멘션했습니다', { body: m.text || '[이미지]' });

                        catch { }

        }).join(''); });

        } const tmo = (p, ms, msg) => Promise.race([p, new Promise((_, no) => setTimeout(() => no({ code: 'timeout', message: msg }), ms))]); let step = 'ImgBB 업로드'; try {

    }
    // ---- 렌더 ----

    function renderAll() { if (!me) {

        }).join('');

    function fmt(t) { const ns = Object.values(users).map(u => {
        return u.nick;
    }).sort((a, b) => {
        return b.length - a.length;
    }).map(n => {
        return esc(n).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }); let h = esc(t); if (ns.length) {
        h = h.replace(new RegExp('@(' + ns.join('|') + ')', 'g'), (a, n) => {

    // 서식: **굵게**  *기울임*  ||스포일러||  줄 맨 앞 "# " / "## " / "### " 큰 글씨
    const inl = s => {
        return s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>').replace(/\|\|(.+?)\|\|/g, '<span class=spo data-a=spo>$1</span>');

    }).join(''); }

        let nav = me.avatar;

            const all = c[k + 'All'] !== false;
            const list = c[k + 'Roles'] || [];
            return `<b>${t}</b><label style="display:flex;gap:6px;align-items:center"><input type=checkbox id=cp_${k}_all ${all ? 'checked' : ''} style="width:auto"> 모든 역할 허용</label><div id=cp_${k}_l style="display:flex;flex-direction:column;gap:4px;padding-left:18px;${all ? 'opacity:.4;pointer-events:none' : ''}">${opts.map(o => { return `<label style="display:flex;gap:6px;align-items:center"><input type=checkbox class=cp_${k} data-r="${esc(o.id)}" ${list.includes(o.id) ? 'checked' : ''} style="width:auto"> ${esc(o.name)}</label>`; }).join('')}</div>`;
        };
        modal(`<h3># ${esc(c.name)} 권한</h3><div style="font-size:12px;color:#949ba4">관리자·매니저·소유자는 항상 보고 보낼 수 있습니다. 보낼 수 있는 역할은 볼 수 있는 역할 안에서만 적용됩니다.</div>${sec('볼 수 있는 역할', 'view')}<hr>${sec('보낼 수 있는 역할', 'send')}<button data-a=chsave data-id=${id}>저장</button><button class=g data-a=close>닫기</button>`);
        ['view', 'send'].forEach(k => {
            $('#cp_' + k + '_all').onchange = e => {
                const l = $('#cp_' + k + '_l');
                l.style.opacity = e.target.checked ? .4 : 1;
                l.style.pointerEvents = e.target.checked ? 'none' : '';
            };
        });
    }

    function rolesModal() {
        const my = rank(me);
        const lv = Object.keys(RANK).filter(k => {
            return k !== 'owner' && (my === 4 || RANK[k] < my);
        });
        const can = l => {
            return my === 4 || RANK[l] < my;
        };
        const sel = x => {
            return lv.map(k => {
                return `<option value=${k} ${x === k ? 'selected' : ''}>${RN[k]} 권한</option>`;
            }).join('');
        };
        modal(`<h3>역할 관리</h3><div style="font-size:12px;color:#949ba4">역할 이름은 자유롭게, 권한은 장식 / 멤버 / 관리자 / 매니저 중에서 고릅니다.</div>${roles.map(x => { const ok = can(x.level); const d = ok ? '' : 'disabled'; return `<div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap"><input type=color id=rc_${x.id} value="${esc(x.color)}" style="width:42px;padding:2px" ${d}><input id=rn_${x.id} value="${esc(x.name)}" style="flex:1;min-width:90px" ${d}><select id=rv_${x.id} style="width:auto" ${d}>${ok ? sel(x.level) : `<option>${RN[x.level]} 권한</option>`}</select>${ok ? `<button data-a=rsave data-id=${x.id}>저장</button><button class=r data-a=rdel data-id=${x.id}>삭제</button>` : ''}</div>`; }).join('')}<hr><b>새 역할</b><div style="display:flex;gap:4px;flex-wrap:wrap"><input type=color id=nc value="#5865f2" style="width:42px;padding:2px"><input id=nn placeholder="역할 이름 (공백/특수문자 가능)" style="flex:1;min-width:120px" maxlength=30><select id=nv style="width:auto">${sel('member')}</select></div><button data-a=radd>역할 추가</button><button class=g data-a=close>닫기</button>`);
        $('#bd').dataset.rm = 1;
    }
    // ---- 액션 ----
    document.addEventListener('click', async (e) => {
        const t = e.target.closest('[data-a]');
        if (!t || !me) {
            return;
        }
        const a = t.dataset.a;
        const id = t.dataset.id;
        const D = db;
        if (a === 'side') {
            document.body.classList.toggle('sl'), document.body.classList.remove('mm');
        }
        else if (a === 'mem') {
            document.body.classList.toggle('mm'), document.body.classList.remove('sl');
        }
        else if (a === 'go') {
            if (!canView(me, chans.find(x => { return x.id === id; }))) {
                return toast('이 채널을 볼 권한이 없습니다');
            }
            cur = id;
            localStorage.cur = id;
            unread[id] = 0;
            document.body.classList.remove('sl');
            renderAll();
        }
        else if (a === 'send') {
            send();
        }
        else if (a === 'upl') {
            $('#fi').click();
        }
        else if (a === 'sug') {
            const ip = $('#ip');
            const p = ip.selectionStart;
            ip.value = ip.value.slice(0, p).replace(/@\S*$/, '@' + t.dataset.n + ' ') + ip.value.slice(p);
            $('#sg').innerHTML = '';
            ip.focus();
        }
        else if (a === 'mention') {
            $('#ip').value += '@' + t.dataset.n + ' ';
            closeM();
            $('#ip').focus();
        }
        else if (a === 'usr') {
            userModal(id);
        }
        else if (a === 'close') {
            closeM();
        }
        else if (a === 'snd' || t.id === 'snd') { }
        else if (a === 'pimg') {
            $('#pf').click();
        }
        else if (a === 'psave') {
            const n = $('#pn').value.trim().replace(/\s+/g, '_');
            const dup = Object.values(users).some(u => {
                return u.nick.toLowerCase() === n.toLowerCase() && u.id !== me.id;
            });
            if (!n || dup) {
                return toast(dup ? '이미 등록된 닉네임입니다' : '닉네임 필요');
            }
            try {
                await claimNick(n, me.id, me.nick);
            }
            catch {
                return toast('이미 등록된 닉네임입니다');
            }
            const upd = { nick: n, alias: $('#pa').value.trim() };
            if ($('#bd').dataset.av) {
                upd.avatar = $('#bd').dataset.av;
            }
            await D.collection('users').doc(me.id).update(upd);
            delete $('#bd').dataset.av;
            closeM();
        }
        else if (a === 'pwsave') {
            const o = $('#pw0').value;
            const n1 = $('#pw1').value;
            const n2 = $('#pw2').value;
            if (!me.pwHash) {
                return toast('비밀번호가 등록되지 않았습니다');
            }
            if (await hpw(o, me.pwSalt) !== me.pwHash) {
                return toast('기존 비밀번호가 올바르지 않습니다');
            }
            if (n1.length < 4) {
                return toast('새 비밀번호는 4자 이상이어야 합니다');
            }
            if (n1 !== n2) {
                return toast('새 비밀번호 확인이 일치하지 않습니다');
            }
            const salt = newSalt();
            await D.collection('users').doc(me.id).update({ pwSalt: salt, pwHash: await hpw(n1, salt) });
            toast('비밀번호가 변경되었습니다');
            closeM();
        }
        else if (a === 'spo') {
            t.classList.toggle('on');
        }
        else if (a === 'logout') {
            if (!confirm('로그아웃할까요?')) {
                return;
            }
            try {
                await D.collection('users').doc(me.id).update({ online: false });
            }
            catch { }
            localStorage.removeItem('uid');
            location.reload();
        }
        else if (a === 'addcat') {
            const n = prompt('카테고리 이름 (공백/특수문자 가능)');
            if (n?.trim()) {
                D.collection('cats').add({ name: n, ts: Date.now() });
            }
        }
        else if (a === 'rencat') {
            const n = prompt('새 이름', cats.find(c => {
                return c.id === id;
            }).name);
            if (n?.trim()) {
                D.collection('cats').doc(id).update({ name: n });
            }
        }
        else if (a === 'delcat') {
            if (!confirm('카테고리와 하위 채팅방을 모두 삭제할까요?')) {
                return;
            }
            for (const h of chans.filter(h => {
                return h.cat === id;
            })) {
                await delChan(h.id);
            }
            D.collection('cats').doc(id).delete();
        }
        else if (a === 'addch') {
            const n = prompt('채팅방 이름 (공백/특수문자 가능)');
            if (n?.trim()) {
                D.collection('chans').add({ name: n, cat: id, ts: Date.now() });
            }
        }
        else if (a === 'renchan') {
            const n = prompt('새 이름', chans.find(c => {
                return c.id === id;
            }).name);
            if (n?.trim()) {
                D.collection('chans').doc(id).update({ name: n });
            }
        }
        else if (a === 'delchan') {
            if (confirm('채팅방과 메시지를 삭제할까요?')) {
                delChan(id);
            }
        }
        else if (a === 'delmsg') {
            D.collection('msgs').doc(id).delete();
        }
        else if (a === 'chperm') {
            if (rank(me) >= 2) {
                chpermModal(id);
            }
        }
        else if (a === 'chsave') {
            if (rank(me) < 2) {
                return toast('권한이 없습니다');
            }
            const g = k => { return { [k + 'All']: $('#cp_' + k + '_all').checked, [k + 'Roles']: [...document.querySelectorAll('input.cp_' + k + ':checked')].map(i => { return i.dataset.r; }) }; };
            await D.collection('chans').doc(id).update({ ...g('view'), ...g('send') });
            toast('채널 권한 저장됨');
            closeM();
        }
        else if (a === 'roles') {
            if (rank(me) >= 3) {
                rolesModal();
            }
        }
        else if (a === 'radd' || a === 'rsave') {
            const my = rank(me);
            const k = a === 'radd' ? 'n' : id ? '' : '';
            const g = (p) => {
                return a === 'radd' ? $('#' + ({ c: 'nc', n: 'nn', v: 'nv' }[p])) : $('#r' + p + '_' + id);
            };
            const name = g('n').value.trim();
            const lvl = g('v').value;
            const old = roles.find(x => {
                return x.id === id;
            });
            if (!name) {
                return toast('역할 이름을 입력하세요');
            }
            if (!(my === 4 || RANK[lvl] < my) || (old && !(my === 4 || RANK[old.level] < my))) {
                return toast('권한이 없습니다');
            }
            const data = { name, color: g('c').value, level: lvl };
            if (a === 'radd') {
                data.ts = Date.now();
                await D.collection('roles').add(data);
            }
            else {
                await D.collection('roles').doc(id).update(data);
            }
            toast('저장됨');
        }
        else if (a === 'rdel') {
            const old = roles.find(x => {
                return x.id === id;
            });
            if (!old || !(rank(me) === 4 || RANK[old.level] < rank(me))) {
                return toast('권한이 없습니다');
            }
            if (confirm('역할을 삭제할까요? 해당 역할의 유저는 멤버가 됩니다.')) {
                D.collection('roles').doc(id).delete();
            }
        }
        else if (a === 'pun') {
            const ty = $('#pt').value;
            const d = +$('#pd').value;
            await D.collection('users').doc(id).update({ punish: { type: ty, until: d ? Date.now() + d * 6e4 : 0, reason: $('#pr').value, by: me.nick } });
            toast('처벌 적용됨');
            closeM();
        }
        else if (a === 'unpun') {
            await D.collection('users').doc(id).update({ punish: firebase.firestore.FieldValue.delete() });
            closeM();
        }
        else if (a === 'role') {
            const nr = $('#rl').value;
            const nx = roles.find(x => {
                return x.id === nr;
            });
            if (!(rank(me) >= 3 && rank(me) > rank(users[id]) && (!nr || nx && RANK[nx.level] < rank(me)))) {
                return toast('권한이 없습니다');
            }
            await D.collection('users').doc(id).update({ roleId: nr, role: firebase.firestore.FieldValue.delete() });
            closeM();
        }
    });
    document.addEventListener('click', e => { if (e.target.id === 'snd') {
        sound = !sound;
        localStorage.snd = sound ? 1 : 0;
        ding();
        renderAll();
    } if (e.target.closest('#meb')) {
        profile();
    } });

    async function delChan(id) { const s = await db.collection('msgs').where('ch', '==', id).get(); let b = db.batch(); let n = 0; for (const d of s.docs) {
        b.delete(d.ref);
        if (++n % 400 === 0) {
            await b.commit();
            b = db.batch();
        }
    } await b.commit(); await db.collection('chans').doc(id).delete(); }
    boot();

    </script>
    </body>
</html>
