    const RC = { decor: '#7a5fc0', member: '#4e5058', admin: '#2d9d5b', manager: '#c9382f', owner: '#e6a117' };

    const OWNER = 'windo6k66';
    // 유저가 가진 역할 목록 (roleIds 배열, 예전 단일 roleId도 인식). roles 목록 순서(위→아래)대로 정렬됨
    const urs = u => {
        const ids = Array.isArray(u?.roleIds) ? u.roleIds : (u?.roleId ? [u.roleId] : []);
        return roles.filter(r => {
            return ids.includes(r.id);
        });
    };
    // 권한 등급 = 가진 역할 중 가장 높은 등급
    const ro = u => {
        if (u?.nick?.toLowerCase() === OWNER) {
            return 'owner';
        }
        const l = urs(u).map(r => {
            return RANK[r.level];
        });
        if (l.length) {
            const mx = Math.max(...l);
            return Object.keys(RANK).find(k => {
                return RANK[k] === mx;
            });
        }
        return u?.role in RANK && u.role !== 'owner' ? u.role : 'member';
    };
    // 표시용 대표 역할 = 목록에서 가장 위에 있는 역할
    const rinfo = u => {
        if (ro(u) === 'owner') {
            return { name: RN.owner, color: RC.owner };
        }
        const x = urs(u)[0];
        if (x) {
            return x;
        }
        const l = ro(u);
        return { name: RN[l], color: RC[l] };
    };
    // 가장 높은 계급의 역할 (등급이 같으면 목록에서 더 위에 있는 역할)
    const trole = u => {
        const l = urs(u);
        if (!l.length) {
            return null;
        }
        return l.reduce((a, r) => {
            return RANK[r.level] > RANK[a.level] ? r : a;
        }, l[0]);
    };
    // 닉네임 색 = 가장 위 역할의 색 (역할이 없으면 기본색)
    const ncol = u => {

    const rbadges = u => {
        const own = ro(u) === 'owner' ? [{ name: RN.owner, color: RC.owner }] : [];
        const all = [...own, ...urs(u)];
        return (all.length ? all : [rinfo(u)]).map(x => {
            return `<span class=rl style="background:${esc(x.color)}">${esc(x.name)}</span>`;
        }).join(' ');
    };
    const rank = u => {
        return RANK[ro(u)];
    };
    // ---- 채널 권한: 역할 키 = 커스텀 역할 id 또는 '_member' 등 기본 등급. 관리자 이상은 항상 가능 ----
    const rk = u => { const x = urs(u).map(r => r.id); return x.length ? x : ['_' + ro(u)]; };
    const canView = (u, c) => !c ? false : (rank(u) >= 2 || c.viewAll !== false || rk(u).some(k => (c.viewRoles || []).includes(k)));
    const canPost = (u, c) => !c ? false : canView(u, c) && (rank(u) >= 2 || c.sendAll !== false || rk(u).some(k => (c.sendRoles || []).includes(k)));
    const vchans = () => chans.filter(c => canView(me, c));

    const av = (u, s) => {
        return u.avatar ? `<img class=av style="width:${s}px;height:${s}px" src="${u.avatar}">` : `<span class=av style="width:${s}px;height:${s}px;background:hsl(${[...u.nick].reduce((a, c) => {
            return a + c.charCodeAt(0) * 7;
        }, 0) % 360},50%,45%);font-size:${s * .45}px">${esc([...u.nick][0])}</span>`;

    const dn = u => {
        const b = u.alias || u.nick;

        const x = trole(u);

    };
    // ---- 알림음 ----
    let ac;

    function ding() { if (!sound) {
        return;
    } try {
        ac = ac || new (window.AudioContext || webkitAudioContext)();
        [880, 1175].forEach((f, i) => { const o = ac.createOscillator(); const g = ac.createGain(); const t = ac.currentTime + i * .14; o.frequency.value = f; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.001, t + .35); o.start(t); o.stop(t + .35); });
    }
    catch { } }
    // ---- 이미지 ----

    function shrink(file, maxH, q, sq) { return new Promise((ok, no) => { const i = new Image(); i.onload = () => { const c = document.createElement('canvas'); const x = c.getContext('2d'); if (sq) {
        c.width = c.height = maxH;
        const m = Math.min(i.width, i.height);
        x.drawImage(i, (i.width - m) / 2, (i.height - m) / 2, m, m, 0, 0, maxH, maxH);
    }
    else {
        const s = Math.min(1, maxH / i.height);
        c.width = Math.round(i.width * s);
        c.height = Math.round(i.height * s);
        x.drawImage(i, 0, 0, c.width, c.height);
    } ok(c.toDataURL('image/jpeg', q)); }; i.onerror = no; i.src = URL.createObjectURL(file); }); }
    // ---- 이미지 (ImgBB) ----
    async function uploadImg(file) {
        if (!IMGBB_KEY || IMGBB_KEY === 'YOUR_IMGBB_API_KEY') { throw { code: 'no-key', message: 'ImgBB API 키가 설정되지 않았습니다' }; }
        const claim = await uniqueName(file.name || 'image.png');
        try {
            const fd = new FormData();
            fd.append('image', file);
            // 확장자를 뺀 이름을 ImgBB에 전달 (예: "1(1)")
            fd.append('name', claim.name.replace(/\.[^.]*$/, ''));
            const r = await fetch('https://api.imgbb.com/1/upload?key=' + encodeURIComponent(IMGBB_KEY), { method: 'POST', body: fd });
            let j = null;
            try { j = await r.json(); } catch { }
            if (!r.ok || !j?.success) { throw { code: 'imgbb-' + r.status, message: j?.error?.message || ('HTTP ' + r.status) }; }
            return j.data.display_url || j.data.url;
        }
        catch (e) {
            // 업로드 실패 시 예약한 이름을 되돌려 번호가 낭비되지 않게 함
            claim.ref.delete().catch(() => { });
            throw e;
        }
    }
    // ---- 중복 파일명 처리: 1.png → 1(1).png → 1(2).png ----
    // 'imgnames' 컬렉션에 업로드된 파일명을 기록하고, 트랜잭션으로 겹치지 않는 이름을 확보
    async function uniqueName(fn) {
        const m = fn.match(/^(.*?)(\.[^.]*)?$/);
        const base = m[1] || 'image';
        const ext = m[2] || '';
        for (let i = 0; i < 1000; i++) {
            const name = i ? `${base}(${i})${ext}` : base + ext;
            const ref = db.collection('imgnames').doc('i_' + encodeURIComponent(name.toLowerCase()).replace(/\./g, '%2E'));
            try {
                await db.runTransaction(async (t) => {
                    const d = await t.get(ref);
                    if (d.exists) { throw new Error('dup'); }
                    t.set(ref, { name, ts: Date.now() });
                });
                return { name, ref };
            }
            catch (e) {
                if (e.message !== 'dup') { throw e; }
            }
        }
        throw { code: 'no-name', message: '사용 가능한 파일 이름을 찾지 못했습니다' };
    }
    // ---- 저장 공간 부족 시 가장 오래된 메시지부터 10개씩 삭제 후 재시도 ----
    async function prune() {
        const s = await db.collection('msgs').orderBy('ts').limit(10).get();
        if (s.empty) {
            return 0;
        }
        const b = db.batch();
        s.forEach(d => {
            return b.delete(d.ref);
        });
        await b.commit();
        return s.size;
    }

        for (let i = 0; i < 20; i++) {
            try {
                const r = await db.collection(col).add(data);
                if (removed) {
                    toast(`저장 공간 부족: 오래된 메시지 ${removed}개를 삭제했습니다`);
                }
                return r;
            }
            catch (e) {
                if (e.code !== 'resource-exhausted') {
                    throw e;
                }
                const n = await prune();
                if (!n) {
                    throw e;
                }
                removed += n;
            }
        }
        return await db.collection(col).add(data);
    }
    // ---- 비밀번호 해시 (SHA-256 + 유저별 솔트) ----
    const newSalt = () => {
        return [...crypto.getRandomValues(new Uint8Array(16))].map(x => {
            return x.toString(16).padStart(2, '0');
        }).join('');
    };

    async function hpw(pw, salt) {
        const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pw));
        return [...new Uint8Array(b)].map(x => {
            return x.toString(16).padStart(2, '0');
        }).join('');
    }
    // ---- 닉네임 서버 등록 (nicks 컬렉션: 문서ID=소문자 닉네임, 트랜잭션으로 중복 방지) ----
    const nk = n => {
        return 'n_' + encodeURIComponent(n.toLowerCase()).replace(/\./g, '%2E');
    };

    async function claimNick(n, uid, old) { const ref = db.collection('nicks').doc(nk(n)); await db.runTransaction(async (t) => { const d = await t.get(ref); if (d.exists && d.data().uid !== uid) {
        throw new Error('dup');
    } t.set(ref, { nick: n, uid, ts: Date.now() }); if (old && old.toLowerCase() !== n.toLowerCase()) {
        t.delete(db.collection('nicks').doc(nk(old)));
    } }); }
    // ---- 링크 미리보기 (제목·설명·썸네일은 microlink.io 공개 API로 조회, 결과는 이 기기에 캐시) ----
    const URL_RE = /https?:\/\/[^\s]+/g;
    const trimRawUrl = u => u.replace(/[.,!?:)\]'"<>]+$/, '');
    const LPK = 'lpc1';
    let lpc = {};
    try { lpc = JSON.parse(localStorage[LPK] || '{}'); } catch { }
    const lpBusy = new Set();
    const lpFail = new Set();
    const lpSave = () => {
        const k = Object.keys(lpc);
        if (k.length > 200) {
            k.slice(0, k.length - 200).forEach(x => { delete lpc[x]; });
        }
        try { localStorage[LPK] = JSON.stringify(lpc); } catch { }
    };
    const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
    const isImgUrl = u => { try { const x = new URL(u); return /\.(png|jpe?g|gif|webp|bmp|avif)$/i.test(x.pathname) || x.hostname === 'i.ibb.co'; } catch { return false; } };
    const httpOnly = u => /^https?:\/\//i.test(u || '') ? u : '';

    function lpHtml(url) {
        const host = hostOf(url);
        if (!host) {
            return '';
        }
        const a = `<a class=lp data-u="${esc(url)}" href="${esc(url)}" target=_blank rel="noopener noreferrer nofollow">`;
        if (isImgUrl(url)) {
            return a.replace('class=lp', 'class="lp lpimg"') + `<img class=lpi loading=lazy referrerpolicy=no-referrer src="${esc(url)}" onerror="this.closest('a').remove()"></a>`;
        }
        const d = lpc[url];
        if (!d && !lpFail.has(url)) {
            lpFetch(url);
        }
        const th = httpOnly(d?.im) || httpOnly(d?.lg) || 'https://www.google.com/s2/favicons?sz=64&domain=' + encodeURIComponent(host);
        return `${a}<img class=lpth loading=lazy referrerpolicy=no-referrer src="${esc(th)}" onerror="this.style.visibility='hidden'"><div class=lpb><div class=lpti>${esc(d?.t || host)}</div><div class=lpds>${esc(host)}${d?.ds ? ' · ' + esc(d.ds) : ''}</div></div></a>`;
    }

    async function lpFetch(url) {
        if (lpBusy.has(url)) {
            return;
        }
        lpBusy.add(url);
        try {
            const r = await fetch('https://api.microlink.io/?url=' + encodeURIComponent(url));
            if (!r.ok) {
                throw 0;
            }
            const j = await r.json();
            const x = j?.data || {};
            lpc[url] = { t: (x.title || '').slice(0, 120), ds: (x.description || '').slice(0, 200), im: x.image?.url || '', lg: x.logo?.url || '' };
            lpSave();
            document.querySelectorAll('a.lp').forEach(e => {
                if (e.dataset.u === url) {
                    e.outerHTML = lpHtml(url);
                }
            });
        }
        catch {
            lpFail.add(url);
        }
        lpBusy.delete(url);
    }

    // 메시지의 첫 번째 링크 하나만 미리보기 (스포일러가 있으면 생략)
    function lpOf(m) {
        if (!m.text || m.text.includes('||')) {
            return '';
        }
        const u = (m.text.match(URL_RE) || [])[0];
        return u ? lpHtml(trimRawUrl(u)) : '';
    }

    // ---- 로컬 저장소 (IndexedDB): 텍스트·이미지를 최대 1GB까지 저장, 초과 시 가장 오래된 것부터 삭제 ----
    const CACHE_MAX = 1024 * 1024 * 1024;
    let cdb = null;
    let cbytes = 0;
    let cq = Promise.resolve();
    let hist = {};
    let live = [];
    let histReady = Promise.resolve();
    const imgObj = {};
    const imgBusy = new Set();
    const imgFail = new Set();
    const imgQ = [];
    let imgRun = 0;
    const rq = r => new Promise((ok, no) => { r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
    const txd = t => new Promise((ok, no) => { t.oncomplete = ok; t.onerror = () => no(t.error); t.onabort = () => no(t.error); });
    const cenq = f => { cq = cq.then(f).catch(() => { }); return cq; };
    const fmtMB = n => (n / 1048576).toFixed(n < 1048576 * 10 ? 1 : 0) + 'MB';

    function cacheInit() {
        return new Promise(ok => {
            try {
                const r = indexedDB.open('fsb-cache', 1);
                r.onupgradeneeded = () => {
                    const d = r.result;
                    d.createObjectStore('txt', { keyPath: 'k' });
                    d.createObjectStore('img', { keyPath: 'k' });
                    d.createObjectStore('idx', { keyPath: 'k' }).createIndex('ts', 'ts');
                };
                r.onsuccess = async () => {
                    cdb = r.result;
                    try {
                        navigator.storage?.persist?.();
                        const t = cdb.transaction(['idx', 'txt'], 'readonly');
                        const [all, ms] = await Promise.all([rq(t.objectStore('idx').getAll()), rq(t.objectStore('txt').getAll())]);
                        cbytes = all.reduce((a, x) => a + x.size, 0);
                        ms.forEach(x => { hist[x.m.id] = x.m; });
                    }
                    catch { }
                    ok();
                };
                r.onerror = () => ok();
                r.onblocked = () => ok();
            }
            catch {
                ok();
            }
        });
    }

    // 가장 오래된 것부터 지워서 총 용량이 target 이하가 되게 함
    async function evictTo(target) {
        let gone = 0;
        while (cbytes > target) {
            const t = cdb.transaction(['idx', 'txt', 'img'], 'readwrite');
            const ix = t.objectStore('idx');
            const rows = await rq(ix.index('ts').getAll(null, 50));
            if (!rows.length) {
                cbytes = 0;
                break;
            }
            for (const r of rows) {
                if (cbytes <= target) {
                    break;
                }
                const txt = r.k[0] === 'm';
                ix.delete(r.k);
                t.objectStore(txt ? 'txt' : 'img').delete(r.k);
                cbytes -= r.size;
                if (txt) {
                    delete hist[r.k.slice(2)];
                    gone++;
                }
                else {
                    delete imgObj[r.k.slice(2)];
                    imgFail.add(r.k.slice(2));
                }
            }
            await txd(t);
        }
        if (gone) {
            rebuild();
        }
    }

    function cachePut(store, k, ts, size, val) {
        if (!cdb) {
            return;
        }
        cenq(async () => {
            const put = async () => {
                const t = cdb.transaction(['idx', store], 'readwrite');
                const ix = t.objectStore('idx');
                const old = await rq(ix.get(k));
                ix.put({ k, ts, size });
                t.objectStore(store).put(store === 'txt' ? { k, m: val } : { k, blob: val });
                await txd(t);
                cbytes += size - (old ? old.size : 0);
            };
            try {
                await put();
            }
            catch {
                try {
                    await evictTo(Math.max(0, cbytes - Math.max(size * 2, 20 * 1048576)));
                    await put();
                }
                catch { }
            }
            await evictTo(CACHE_MAX);
        });
    }

    function cacheDel(k) {
        if (!cdb) {
            return;
        }
        cenq(async () => {
            const t = cdb.transaction(['idx', 'txt', 'img'], 'readwrite');
            const ix = t.objectStore('idx');
            const o = await rq(ix.get(k));
            if (!o) {
                return;
            }
            ix.delete(k);
            t.objectStore(k[0] === 'm' ? 'txt' : 'img').delete(k);
            await txd(t);
            cbytes -= o.size;
        });
    }

    const cacheMsg = m => {
        cachePut('txt', 'm:' + m.id, m.ts, new TextEncoder().encode(JSON.stringify(m)).length + 64, m);
    };

    async function cacheClear() {
        if (!cdb) {
            return;
        }
        await cenq(async () => {
            const t = cdb.transaction(['idx', 'txt', 'img'], 'readwrite');
            ['idx', 'txt', 'img'].forEach(s => { t.objectStore(s).clear(); });
            await txd(t);
            cbytes = 0;
        });
        hist = {};
        Object.keys(imgObj).forEach(k => { delete imgObj[k]; });
        imgFail.clear();
        rebuild();
    }

    // 서버의 최근 메시지(live) + 로컬에만 남아 있는 더 오래된 메시지(hist)를 합쳐서 표시
    function rebuild() {
        const ids = new Set(live.map(m => m.id));
        const minTs = live.length ? live[0].ts : Infinity;
        msgs = [...Object.values(hist).filter(m => !ids.has(m.id) && m.ts < minTs).sort((a, b) => a.ts - b.ts), ...live];
        if (me) {
            renderTree();
            renderMsgs();
        }
    }

    // 이미지를 로컬에 내려받아 저장 (동시 3개, 최신 것 먼저)
    function ensureImg(url, ts) {
        if (!cdb || !url || imgObj[url] || imgBusy.has(url) || imgFail.has(url)) {
            return;
        }
        imgBusy.add(url);
        imgQ.push([url, ts]);
        pumpImg();
    }

    function pumpImg() {
        while (imgRun < 3 && imgQ.length) {
            const [url, ts] = imgQ.pop();
            imgRun++;
            loadImg(url, ts).finally(() => {
                imgRun--;
                imgBusy.delete(url);
                pumpImg();
            });
        }
    }

    async function loadImg(url, ts) {
        try {
            const k = 'i:' + url;
            const row = await rq(cdb.transaction('img', 'readonly').objectStore('img').get(k));
            let blob = row?.blob;
            if (!blob) {
                const r = await fetch(url, { mode: 'cors' });
                if (!r.ok) {
                    throw 0;
                }
                blob = await r.blob();
                if (!blob.type.startsWith('image/')) {
                    throw 0;
                }
                cachePut('img', k, ts, blob.size, blob);
            }
            imgObj[url] = URL.createObjectURL(blob);
            document.querySelectorAll('img.mi').forEach(i => {
                if (i.dataset.u === url) {
                    i.src = imgObj[url];
                }
            });
        }
        catch {
            imgFail.add(url);
        }
    }

            return;
        }
        const opts = [{ id: '_member', name: '기본 멤버' }, { id: '_decor', name: '기본 장식' }, ...roles.map(r => { return { id: r.id, name: r.name + (RANK[r.level] >= 2 ? ' (항상 가능)' : '') }; })];
        const sec = (t, k) => {
            const all = c[k + 'All'] !== false;
            const list = c[k + 'Roles'] || [];
            return `<b>${t}</b><label style="display:flex;gap:6px;align-items:center"><input type=checkbox id=cp_${k}_all ${all ? 'checked' : ''} style="width:auto"> 모든 역할 허용</label><div id=cp_${k}_l style="display:flex;flex-direction:column;gap:4px;padding-left:18px;${all ? 'opacity:.4;pointer-events:none' : ''}">${opts.map(o => { return `<label style="display:flex;gap:6px;align-items:center"><input type=checkbox class=cp_${k} data-r="${esc(o.id)}" ${list.includes(o.id) ? 'checked' : ''} style="width:auto"> ${esc(o.name)}</label>`; }).join('')}</div>`;
        };
        modal(`<h3># ${esc(c.name)} 권한</h3><div style="font-size:12px;color:#949ba4">관리자·매니저·소유자는 항상 보고 보낼 수 있습니다. 보낼 수 있는 역할은 볼 수 있는 역할 안에서만 적용됩니다.</div>${sec('볼 수 있는 역할', 'view')}<hr>${sec('보낼 수 있는 역할', 'send')}<button data-a=chsave data-id=${id}>저장</button><button class=g data-a=close>닫기</button>`);
        ['view', 'send'].forEach(k => {
            $('#cp_' + k + '_all').onchange = e => {
                const l = $('#cp_' + k + '_l');
                l.style.opacity = e.target.checked ? .4 : 1;
                l.style.pointerEvents = e.target.checked ? 'none' : '';
            };
        });
    }

    function rolesModal() {
        const my = rank(me);
        const lv = Object.keys(RANK).filter(k => {
            return k !== 'owner' && (my === 4 || RANK[k] < my);
        });
        const can = l => {
            return my === 4 || RANK[l] < my;
        };
        const sel = x => {
            return lv.map(k => {
                return `<option value=${k} ${x === k ? 'selected' : ''}>${RN[k]} 권한</option>`;
            }).join('');
        };
        modal(`<h3>역할 관리</h3><div style="font-size:12px;color:#949ba4">역할 이름은 자유롭게, 권한은 장식 / 멤버 / 관리자 / 매니저 중에서 고릅니다. 한 유저에게 여러 역할을 줄 수 있고, 목록에서 위에 있는 역할의 색이 닉네임 색이 됩니다 (▲▼로 순서 변경).</div>${roles.map(x => { const ok = can(x.level); const d = ok ? '' : 'disabled'; return `<div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap"><input type=color id=rc_${x.id} value="${esc(x.color)}" style="width:42px;padding:2px" ${d}><input id=rn_${x.id} value="${esc(x.name)}" style="flex:1;min-width:90px" ${d}><select id=rv_${x.id} style="width:auto" ${d}>${ok ? sel(x.level) : `<option>${RN[x.level]} 권한</option>`}</select>${ok ? `<button class=g data-a=rup data-id=${x.id}>▲</button><button class=g data-a=rdn data-id=${x.id}>▼</button><button data-a=rsave data-id=${x.id}>저장</button><button class=r data-a=rdel data-id=${x.id}>삭제</button>` : ''}</div>`; }).join('')}<hr><b>새 역할</b><div style="display:flex;gap:4px;flex-wrap:wrap"><input type=color id=nc value="#5865f2" style="width:42px;padding:2px"><input id=nn placeholder="역할 이름 (공백/특수문자 가능)" style="flex:1;min-width:120px" maxlength=30><select id=nv style="width:auto">${sel('member')}</select></div><button data-a=radd>역할 추가</button><button class=g data-a=close>닫기</button>`);
        $('#bd').dataset.rm = 1;
    }
    // ---- 액션 ----
    document.addEventListener('click', async (e) => {
        const t = e.target.closest('[data-a]');
        if (!t || !me) {
            return;
        }
        const a = t.dataset.a;
        const id = t.dataset.id;
        const D = db;
        if (a === 'side') {
            document.body.classList.toggle('sl'), document.body.classList.remove('mm');
        }
        else if (a === 'mem') {
            document.body.classList.toggle('mm'), document.body.classList.remove('sl');
        }
        else if (a === 'go') {
            if (!canView(me, chans.find(x => { return x.id === id; }))) {
                return toast('이 채널을 볼 권한이 없습니다');
            }
            cur = id;
            localStorage.cur = id;
            unread[id] = 0;
            document.body.classList.remove('sl');
            renderAll();
        }
        else if (a === 'send') {
            send();
        }
        else if (a === 'upl') {
            $('#fi').click();
        }
        else if (a === 'chlink') {
            const c = chans.find(x => { return x.id === id; });
            if (!c || !canView(me, c)) {
                return toast('이 채널을 볼 권한이 없습니다');
            }
            cur = id;
            localStorage.cur = id;
            unread[id] = 0;
            document.body.classList.remove('sl');
            renderAll();
        }
        else if (a === 'sugch') {
            const ip = $('#ip');
            const p = ip.selectionStart;
            const nm = chans.find(x => { return x.id === id; })?.name || '';
            ip.value = ip.value.slice(0, p).replace(/#\S*$/, '#' + nm + ' ') + ip.value.slice(p);
            $('#sg').innerHTML = '';
            ip.focus();
        }
        else if (a === 'cclear') {
            if (confirm('이 기기에 저장된 메시지·이미지 기록을 모두 지울까요? (서버 데이터는 유지됩니다)')) {
                await cacheClear();
                const u = $('#cuse');
                if (u) {
                    u.textContent = `사용 중 ${fmtMB(cbytes)} / 1GB`;
                }
                toast('로컬 저장소를 비웠습니다');
            }
        }
        else if (a === 'sug') {
            const ip = $('#ip');
            const p = ip.selectionStart;
            ip.value = ip.value.slice(0, p).replace(/@\S*$/, '@' + t.dataset.n + ' ') + ip.value.slice(p);
            $('#sg').innerHTML = '';
            ip.focus();
        }
        else if (a === 'mention') {
            $('#ip').value += '@' + t.dataset.n + ' ';
            closeM();
            $('#ip').focus();
        }
        else if (a === 'usr') {
            userModal(id);
        }
        else if (a === 'close') {
            closeM();
        }
        else if (a === 'snd' || t.id === 'snd') { }
        else if (a === 'pimg') {
            $('#pf').click();
        }
        else if (a === 'psave') {
            const n = $('#pn').value.trim().replace(/\s+/g, '_');
            const dup = Object.values(users).some(u => {
                return u.nick.toLowerCase() === n.toLowerCase() && u.id !== me.id;
            });
            if (['everyone', 'here'].includes(n.toLowerCase())) {
                return toast('사용할 수 없는 닉네임입니다');
            }
            if (!n || dup) {
                return toast(dup ? '이미 등록된 닉네임입니다' : '닉네임 필요');
            }
            try {
                await claimNick(n, me.id, me.nick);
            }
            catch {
                return toast('이미 등록된 닉네임입니다');
            }
            const upd = { nick: n, alias: $('#pa').value.trim() };
            if ($('#bd').dataset.av) {
                upd.avatar = $('#bd').dataset.av;
            }
            await D.collection('users').doc(me.id).update(upd);
            delete $('#bd').dataset.av;
            closeM();
        }
        else if (a === 'pwsave') {
            const o = $('#pw0').value;
            const n1 = $('#pw1').value;
            const n2 = $('#pw2').value;
            if (!me.pwHash) {
                return toast('비밀번호가 등록되지 않았습니다');
            }
            if (await hpw(o, me.pwSalt) !== me.pwHash) {
                return toast('기존 비밀번호가 올바르지 않습니다');
            }
            if (n1.length < 4) {
                return toast('새 비밀번호는 4자 이상이어야 합니다');
            }
            if (n1 !== n2) {
                return toast('새 비밀번호 확인이 일치하지 않습니다');
            }
            const salt = newSalt();
            await D.collection('users').doc(me.id).update({ pwSalt: salt, pwHash: await hpw(n1, salt) });
            toast('비밀번호가 변경되었습니다');
            closeM();
        }
        else if (a === 'spo') {
            t.classList.toggle('on');
        }
        else if (a === 'logout') {
            if (!confirm('로그아웃할까요?')) {
                return;
            }
            try {
                await D.collection('users').doc(me.id).update({ online: false });
            }
            catch { }
            localStorage.removeItem('uid');
            location.reload();
        }
        else if (a === 'addcat') {
            const n = prompt('카테고리 이름 (공백/특수문자 가능)');
            if (n?.trim()) {
                D.collection('cats').add({ name: n, ts: Date.now() });
            }
        }
        else if (a === 'rencat') {
            const n = prompt('새 이름', cats.find(c => {
                return c.id === id;
            }).name);
            if (n?.trim()) {
                D.collection('cats').doc(id).update({ name: n });
            }
        }
        else if (a === 'delcat') {
            if (!confirm('카테고리와 하위 채팅방을 모두 삭제할까요?')) {
                return;
            }
            for (const h of chans.filter(h => {
                return h.cat === id;
            })) {
                await delChan(h.id);
            }
            D.collection('cats').doc(id).delete();
        }
        else if (a === 'addch') {
            const n = prompt('채팅방 이름 (공백/특수문자 가능)');
            if (n?.trim()) {
                D.collection('chans').add({ name: n, cat: id, ts: Date.now() });
            }
        }
        else if (a === 'renchan') {
            const n = prompt('새 이름', chans.find(c => {
                return c.id === id;
            }).name);
            if (n?.trim()) {
                D.collection('chans').doc(id).update({ name: n });
            }
        }
        else if (a === 'delchan') {
            if (confirm('채팅방과 메시지를 삭제할까요?')) {
                delChan(id);
            }
        }
        else if (a === 'delmsg') {
            D.collection('msgs').doc(id).delete();
        }
        else if (a === 'chperm') {
            if (rank(me) >= 2) {
                chpermModal(id);
            }
        }
        else if (a === 'chsave') {
            if (rank(me) < 2) {
                return toast('권한이 없습니다');
            }
            const g = k => { return { [k + 'All']: $('#cp_' + k + '_all').checked, [k + 'Roles']: [...document.querySelectorAll('input.cp_' + k + ':checked')].map(i => { return i.dataset.r; }) }; };
            await D.collection('chans').doc(id).update({ ...g('view'), ...g('send') });
            toast('채널 권한 저장됨');
            closeM();
        }
        else if (a === 'roles') {
            if (rank(me) >= 3) {
                rolesModal();
            }
        }
        else if (a === 'radd' || a === 'rsave') {
            const my = rank(me);
            const k = a === 'radd' ? 'n' : id ? '' : '';
            const g = (p) => {
                return a === 'radd' ? $('#' + ({ c: 'nc', n: 'nn', v: 'nv' }[p])) : $('#r' + p + '_' + id);
            };
            const name = g('n').value.trim();
            const lvl = g('v').value;
            const old = roles.find(x => {
                return x.id === id;
            });
            if (!name) {
                return toast('역할 이름을 입력하세요');
            }
            if (!(my === 4 || RANK[lvl] < my) || (old && !(my === 4 || RANK[old.level] < my))) {
                return toast('권한이 없습니다');
            }
            const data = { name, color: g('c').value, level: lvl };
            if (a === 'radd') {
                data.ts = Date.now();
                await D.collection('roles').add(data);
            }
            else {
                await D.collection('roles').doc(id).update(data);
            }
            toast('저장됨');
        }
        else if (a === 'rmv') {
            const my = rank(me);
            const tu = users[$('#rsec')?.dataset.u];
            const self = tu && tu.id === me.id;
            const vis = roles.filter(x => {
                return self ? RANK[x.level] <= my : RANK[x.level] < my;
            });
            const i = vis.findIndex(x => {
                return x.id === id;
            });
            const j = t.dataset.d === 'up' ? i - 1 : i + 1;
            if (i < 0 || j < 0 || j >= vis.length) {
                return;
            }
            const ok = x => {
                return my === 4 || RANK[x.level] < my;
            };
            if (my < 2 || !ok(vis[i]) || !ok(vis[j])) {
                return toast('권한이 없습니다');
            }
            const bt = D.batch();
            bt.update(D.collection('roles').doc(vis[i].id), { ts: vis[j].ts });
            bt.update(D.collection('roles').doc(vis[j].id), { ts: vis[i].ts });
            await bt.commit();
        }
        else if (a === 'rup' || a === 'rdn') {
            const my = rank(me);
            const i = roles.findIndex(x => {
                return x.id === id;
            });
            const j = a === 'rup' ? i - 1 : i + 1;
            if (i < 0 || j < 0 || j >= roles.length) {
                return;
            }
            const ok = x => {
                return my === 4 || RANK[x.level] < my;
            };
            if (my < 3 || !ok(roles[i]) || !ok(roles[j])) {
                return toast('권한이 없습니다');
            }
            const bt = D.batch();
            bt.update(D.collection('roles').doc(roles[i].id), { ts: roles[j].ts });
            bt.update(D.collection('roles').doc(roles[j].id), { ts: roles[i].ts });
            await bt.commit();
        }
        else if (a === 'rdel') {
            const old = roles.find(x => {
                return x.id === id;
            });
            if (!old || !(rank(me) === 4 || RANK[old.level] < rank(me))) {
                return toast('권한이 없습니다');
            }
            if (confirm('역할을 삭제할까요? 모든 유저에게서 이 역할이 제거됩니다.')) {
                D.collection('roles').doc(id).delete();
            }
        }
        else if (a === 'pun') {
            const ty = $('#pt').value;
            const d = +$('#pd').value;
            await D.collection('users').doc(id).update({ punish: { type: ty, until: d ? Date.now() + d * 6e4 : 0, reason: $('#pr').value, by: me.nick } });
            toast('처벌 적용됨');
            closeM();
        }
        else if (a === 'unpun') {
            await D.collection('users').doc(id).update({ punish: firebase.firestore.FieldValue.delete() });
            closeM();
        }
        else if (a === 'role') {
            const sel = [...document.querySelectorAll('input.ur:checked')].map(i => {
                return i.dataset.r;
            });
            const tg = users[id];
            const self = id === me.id;
            const lim = self ? rank(me) : rank(me) - 1;
            const bad = sel.some(rid => {
                const x = roles.find(r => {
                    return r.id === rid;
                });
                return !x || RANK[x.level] > lim;
            });
            if (!tg || !(rank(me) >= 2 && (self || rank(me) > rank(tg))) || bad) {
                return toast('권한이 없습니다');
            }
            if (self && ro(me) !== 'owner') {
                const nm = Math.max(RANK.member, ...sel.map(rid => {
                    return RANK[roles.find(r => {
                        return r.id === rid;
                    }).level];
                }));
                if (nm < rank(me) && !confirm('역할을 바꾸면 내 권한이 낮아지고, 낮아진 뒤에는 스스로 다시 올릴 수 없습니다. 계속할까요?')) {
                    return;
                }
            }
            await D.collection('users').doc(id).update({ roleIds: sel, roleId: firebase.firestore.FieldValue.delete(), role: firebase.firestore.FieldValue.delete() });
            toast('역할 저장됨');
            closeM();
        }
    });
    document.addEventListener('click', e => { if (e.target.id === 'snd') {
        sound = !sound;
        localStorage.snd = sound ? 1 : 0;
        ding();
        renderAll();
    } if (e.target.closest('#meb')) {
        profile();
    } });

    async function delChan(id) { const s = await db.collection('msgs').where('ch', '==', id).get(); let b = db.batch(); let n = 0; for (const d of s.docs) {
        b.delete(d.ref);
        if (++n % 400 === 0) {
            await b.commit();
            b = db.batch();
        }
    } await b.commit(); await db.collection('chans').doc(id).delete(); }
    boot();

    </script>
    </body>
</html>
