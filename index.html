<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>필승부대 커뮤니티</title>
<style>
    @font-face {
        font-family:'Korail';
        src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2511-Korail@1.0/KorailL.woff2') format('woff2');
        font-weight:300;
        font-display:swap
    }

    @font-face {
        font-family:'Korail';
        src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2511-Korail@1.0/KorailM.woff2') format('woff2');
        font-weight:400;
        font-display:swap
    }

    @font-face {
        font-family:'Korail';
        src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2511-Korail@1.0/KorailB.woff2') format('woff2');
        font-weight:600;
        font-display:swap
    }

    * {
        box-sizing:border-box
    }

    html,body {
        height:100%;
        margin:0;
        background:#313338;
        color:#dbdee1;
        font:400 15px/1.4 'Korail',system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif
    }

    button,input,select,textarea {
        font:inherit;
        color:inherit
    }

    button {
        background:#5865f2;
        border:0;
        border-radius:4px;
        padding:7px 12px;
        cursor:pointer;
        color:#fff
    }

    button.g {
        background:#4e5058
    }

    button.r {
        background:#da373c
    }

    input,select,textarea {
        background:#1e1f22;
        border:0;
        border-radius:4px;
        padding:9px;
        width:100%;
        outline:0
    }

    #app {
        display:flex;
        height:100%;
        overflow:hidden
    }

    .side {
        width:250px;
        background:#2b2d31;
        display:flex;
        flex-direction:column;
        flex:none;
        z-index:5
    }

    .sh {
        padding:14px;
        font-weight:700;
        border-bottom:1px solid #1e1f22;
        display:flex;
        justify-content:space-between;
        align-items:center
    }

    .tree {
        flex:1;
        overflow:auto;
        padding:8px
    }

    .cat {
        display:flex;
        justify-content:space-between;
        font-size:12px;
        font-weight:700;
        color:#949ba4;
        margin:14px 4px 4px;
        text-transform:uppercase;
        word-break:break-all
    }

    .ch {
        display:flex;
        align-items:center;
        padding:6px 8px;
        border-radius:4px;
        color:#949ba4;
        cursor:pointer;
        word-break:break-all;
        gap:4px
    }

    .ch:hover,.ch.on {
        background:#3a3c42;
        color:#fff
    }

    .ch.on {
        background:#404249
    }
    .tree .dragging { opacity:.45; }
    .tree .drop-target { outline:2px dashed #5865f2; outline-offset:2px; background:#353844; }
    .tree [draggable=true] { cursor:grab; }

    .ac i {
        font-style:normal;
        cursor:pointer;
        margin-left:6px;
        opacity:.7
    }

    .add {
        color:#949ba4;
        cursor:pointer;
        padding:10px 4px;
        font-size:13px
    }

    .bg {
        background:#da373c;
        color:#fff;
        border-radius:9px;
        font-size:11px;
        padding:0 6px;
        margin-left:auto
    }

    .meb {
        display:flex;
        gap:8px;
        align-items:center;
        padding:10px;
        background:#232428;
        cursor:pointer
    }

    .av {
        border-radius:50%;
        object-fit:cover;
        display:inline-flex;
        align-items:center;
        justify-content:center;
        color:#fff;
        font-weight:700;
        flex:none
    }

    .main {
        flex:1;
        display:flex;
        flex-direction:column;
        min-width:0
    }

    .top {
        display:flex;
        align-items:center;
        gap:8px;
        padding:10px 12px;
        border-bottom:1px solid #1e1f22;
        font-weight:700
    }

    .ib {
        background:none;
        padding:4px 8px;
        font-size:18px;
        color:#b5bac1
    }

    .ml {
        flex:1;
        overflow:auto;
        padding:10px 0
    }

    .m {
        display:flex;
        gap:12px;
        padding:2px 14px;
        position:relative
    }

    .m:hover {
        background:#2e3035
    }

    .m.h {
        margin-top:12px
    }

    .m .sp {
        width:40px;
        flex:none
    }

    .mc {
        min-width:0;
        flex:1;
        word-break:break-word
    }

    .nm {
        font-weight:600;
        cursor:pointer
    }

    .tm {
        font-size:11px;
        color:#949ba4;
        margin-left:6px
    }

    .x {
        position:absolute;
        right:10px;
        top:0;
        display:none;
        cursor:pointer
    }

    .m:hover .x {
        display:block
    }

    .mn {
        background:#4a4f8f;
        color:#c9cdfb;
        border-radius:3px;
        padding:0 2px
    }

    .mn.me {
        background:#6a5a1f;
        color:#ffe08a
    }

    .lk {
        color:#00a8fc;
        text-decoration:none;
        word-break:break-all
    }

    .lk:hover {
        text-decoration:underline
    }

    a.lp {
        display:flex;
        gap:8px;
        align-items:center;
        max-width:min(360px,100%);
        margin-top:4px;
        padding:6px 8px;
        background:#2b2d31;
        border-left:3px solid #5865f2;
        border-radius:4px;
        color:inherit;
        text-decoration:none;
        overflow:hidden
    }

    a.lp:hover {
        background:#35373c
    }

    .lpth {
        width:44px;
        height:44px;
        border-radius:4px;
        object-fit:cover;
        flex:none;
        background:#1e1f22
    }

    .lpb {
        min-width:0;
        flex:1
    }

    .lpti {
        font-size:13px;
        font-weight:600;
        color:#00a8fc;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis
    }

    .lpds {
        font-size:11px;
        color:#949ba4;
        display:-webkit-box;
        -webkit-line-clamp:2;
        -webkit-box-orient:vertical;
        overflow:hidden;
        word-break:break-word
    }

    a.lp.lpimg {
        padding:0;
        border:0;
        background:none
    }

    .lpi {
        max-width:min(240px,100%);
        max-height:150px;
        border-radius:4px;
        display:block
    }

    .chl {
        background:#3d4270;
        color:#c9cdfb;
        border-radius:3px;
        padding:0 2px;
        cursor:pointer
    }

    .chl:hover {
        background:#5865f2;
        color:#fff
    }

    .hd {
        font-weight:700;
        line-height:1.25
    }

    .hd1 {
        font-size:1.9em
    }

    .hd2 {
        font-size:1.5em
    }

    .hd3 {
        font-size:1.2em
    }

    .spo {
        background:#1e1f22;
        color:transparent;
        border-radius:3px;
        padding:0 2px;
        cursor:pointer;
        user-select:none
    }

    .spo.on {
        background:#3a3c42;
        color:inherit;
        user-select:text
    }

    .m.ment {
        background:#44401f;
        border-left:3px solid #f0b232
    }

    .mi {
        max-width:min(480px,100%);
        max-height:320px;
        border-radius:6px;
        display:block;
        margin-top:4px
    }

    .cb {
        display:flex;
        gap:6px;
        padding:10px 12px calc(10px + env(safe-area-inset-bottom));
        align-items:flex-end
    }

    .cb input,.cb textarea {
        flex:1
    }

    .cb textarea {
        resize:none;
        max-height:140px;
        line-height:1.4;
        overflow-y:auto;
        display:block
    }

    .sg div {
        padding:6px 12px;
        background:#2b2d31;
        display:flex;
        gap:8px;
        align-items:center;
        cursor:pointer
    }

    .mem {
        width:220px;
        background:#2b2d31;
        overflow:auto;
        padding:8px;
        flex:none;
        display:flex;
        flex-direction:column
    }

    .mem .lo {
        position:sticky;
        bottom:0;
        margin-top:auto;
        width:100%;
        flex:none
    }

    .mem h4 {
        font-size:12px;
        color:#949ba4;
        margin:10px 4px 4px
    }

    .u {
        display:flex;
        gap:8px;
        align-items:center;
        padding:5px;
        border-radius:4px;
        cursor:pointer;
        position:relative
    }

    .u:hover {
        background:#3a3c42
    }

    .u.off {
        opacity:.45
    }

    .dot {
        width:10px;
        height:10px;
        border-radius:50%;
        background:#23a55a;
        border:2px solid #2b2d31;
        position:absolute;
        left:28px;
        top:26px
    }

    .rl {
        font-size:10px;
        padding:0 5px;
        border-radius:3px;
        margin-left:4px;
        color:#fff
    }

    .bd {
        position:fixed;
        inset:0;
        background:#000a;
        display:none;
        align-items:center;
        justify-content:center;
        z-index:20;
        padding:14px
    }

    .bd.on {
        display:flex
    }

    .md {
        background:#313338;
        border-radius:8px;
        padding:18px;
        width:100%;
        max-width:400px;
        max-height:90vh;
        overflow:auto;
        display:flex;
        flex-direction:column;
        gap:10px
    }

    .ts {
        position:fixed;
        bottom:80px;
        left:50%;
        transform:translateX(-50%);
        background:#111;
        padding:10px 16px;
        border-radius:6px;
        z-index:30
    }

    .full {
        position:fixed;
        inset:0;
        background:#313338;
        z-index:40;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:20px
    }

    .full>div {
        max-width:420px;
        width:100%;
        display:flex;
        flex-direction:column;
        gap:10px
    }

    .mt{position:absolute;right:10px;top:-14px;display:none;background:#313338;border:1px solid #1e1f22;border-radius:6px;padding:2px;gap:2px;z-index:3}
    .m:hover .mt,.m.sel .mt{display:flex}
    .mt span{padding:2px 6px;cursor:pointer;border-radius:4px;font-size:14px}
    .mt span:hover{background:#404249}
    .rp{display:flex;gap:6px;align-items:center;font-size:12px;color:#949ba4;margin-bottom:2px;cursor:pointer;min-width:0;max-width:100%}
    .rp:before{content:'';width:18px;height:10px;border-left:2px solid #4e5058;border-top:2px solid #4e5058;border-radius:6px 0 0 0;flex:none;margin-top:6px}
    .rp b{color:#b5bac1;font-weight:600;flex:none}
    .rp i{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rxs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
    .rx{display:inline-flex;gap:4px;align-items:center;padding:1px 7px;border-radius:8px;background:#2b2d31;border:1px solid transparent;cursor:pointer;font-size:13px;user-select:none}
    .rx.on{background:#3d4270;border-color:#5865f2}
    .ed{font-size:10px;color:#949ba4}
    .rb{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#2b2d31;font-size:12px;color:#b5bac1;border-top:1px solid #1e1f22}
    .rb span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rb button{padding:2px 8px}
    #ep{position:fixed;z-index:25;background:#2b2d31;border:1px solid #1e1f22;border-radius:8px;padding:6px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-width:calc(100vw - 16px)}
    #ep span{font-size:20px;padding:4px;text-align:center;cursor:pointer;border-radius:4px}
    #ep span:hover{background:#404249}
    .m.flash{background:#3a3d5c}
    .voice-panel{padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;min-height:100%;color:#dbdee1}
    .voice-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    .voice-actions button{padding:10px 14px;border-radius:6px;border:0;background:#5865f2;color:white;font-weight:600}
    .voice-actions button.r{background:#da373c}
    .voice-users{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:12px}
    .voice-user{background:#232428;border-radius:8px;padding:12px;min-width:110px;display:flex;align-items:center;gap:8px}
    .voice-user small{color:#23a55a}
    @media(max-width:800px) {
        .side {
            position:fixed;
            left:0;
            top:0;
            bottom:0;
            transform:translateX(-100%);
            transition:.2s;
            width:80%;
            max-width:300px
        }
        .mem {
            position:fixed;
            right:0;
            top:0;
            bottom:0;
            transform:translateX(100%);
            transition:.2s;
            z-index:5;
            width:75%;
            max-width:260px
        }
        body.sl .side,body.mm .mem {
            transform:none
        }
        .x {
            display:block
        }
    }

    @media(min-width:801px) {
        #mb,#mm {
            display:none
        }
    }

<script>
    // ===== Firebase 설정 (앱 시작 시 가장 먼저 적용) =====
    // 이미지: ImgBB API (https://api.imgbb.com/ 에서 발급한 키를 아래에 입력)
    const IMGBB_KEY = '6d579e8af35437caa5c39b09f7934fd2';
    // 메인 서버: 유저, 카테고리, 채팅방, 메시지 (이미지는 ImgBB에 올리고 URL만 저장)
    const CFG_MAIN = { apiKey: "AIzaSyDp6gO-g1is11kBGdYL8Ay9OyEbp6IslpQ", authDomain: "robloxdiscordsure-victory-unit.firebaseapp.com", projectId: "robloxdiscordsure-victory-unit", storageBucket: "robloxdiscordsure-victory-unit.firebasestorage.app", messagingSenderId: "485777523197", appId: "1:485777523197:web:642f63a4ae95ed97b7d994" };

    // ===== 개발자 도구가 열리면 콘솔을 먹통으로 만들기 (개발 중에는 false로 끄세요) =====
    const ANTI_DEVTOOLS = true;
    if (ANTI_DEVTOOLS) {
        (() => {
            const noop = () => { };
            let blocked = false;
            // 개발자 도구가 열려 있으면 debugger 문에서 실행이 멈춰 시간이 크게 지연됨
            const trap = () => {
                const t = performance.now();
                (function () { }).constructor('debugger')();
                return performance.now() - t > 100;
            };
            const block = () => {
                if (!blocked) {
                    blocked = true;
                    ['log', 'info', 'warn', 'error', 'debug', 'table', 'dir', 'trace'].forEach(k => {
                        console[k] = noop;
                    });
                }
                try {
                    console.clear();
                }
                catch { }
            };
            setInterval(() => {
                const open = trap() || outerWidth - innerWidth > 160 || outerHeight - innerHeight > 160;
                if (open) {
                    block();
                }
            }, 100);
        })();
    }

    const $ = s => {
        return document.querySelector(s);
    };
    const esc = s => {
        return String(s ?? '').replace(/[&<>"']/g, c => {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]);
        });
    };
    const today = () => {
        return new Date().toLocaleDateString('sv');
    };
    const RANK = { decor: 0, member: 1, admin: 2, manager: 3, owner: 4 };
    const RN = { decor: '장식', member: '멤버', admin: '관리자', manager: '매니저', owner: '대통령' };
    const RC = { decor: '#7a5fc0', member: '#4e5058', admin: '#2d9d5b', manager: '#c9382f', owner: '#e6a117' };
    const NF = 'pixilart-drawing.png';
    let db;
    let roles = [];
    let me;
    let users = {};
    let cats = [];
    let chans = [];
    let msgs = [];
    let cur = localStorage.cur || null;
    let unread = {};
    let sound = localStorage.snd !== '0';
    let first = true;
    let replyTo = null;
    let kickInit = false;
    let kickSeen = null;
    let editing = null;
    let pickMsg = null;
    let mem = {};
    let lastDay = today();
    let started = false;
    // WebRTC 음성방: 별도 서버 대신 기존 Firestore를 시그널링 교환에 사용
    let voiceRoomId = null;
    let voiceStream = null;
    let voicePeerUnsub = null;
    let voiceSignalUnsub = null;
    let voicePeers = {};
    let voiceMuted = false;
    let voicePeerDocs = {};
    let voiceProcessingSignals = new Set();
    let voiceJoinedAt = 0;
    let voiceRaw = null, voiceCtx = null, voiceFx = null;
    let voiceBeat = null;
    const VOICE_STALE = 45000;
    const OWNER = 'windo6k66';
    // 유저가 가진 역할 목록 (roleIds 배열, 예전 단일 roleId도 인식). roles 목록 순서(위→아래)대로 정렬됨
    const urs = u => {
        const ids = Array.isArray(u?.roleIds) ? u.roleIds : (u?.roleId ? [u.roleId] : []);
        return roles.filter(r => {
            return ids.includes(r.id);
        });
    };
    // 권한 등급 = 가진 역할 중 가장 높은 등급
    const ro = u => {
        if (u?.nick?.toLowerCase() === OWNER) {
            return 'owner';
        }
        const l = urs(u).map(r => {
            return RANK[r.level];
        });
        if (l.length) {
            const mx = Math.max(...l);
            return Object.keys(RANK).find(k => {
                return RANK[k] === mx;
            });
        }
        return u?.role in RANK && u.role !== 'owner' ? u.role : 'member';
    };
    // 표시용 대표 역할 = 목록에서 가장 위에 있는 역할
    const rinfo = u => {
        if (ro(u) === 'owner') {
            return { name: RN.owner, color: RC.owner };
        }
        const x = urs(u)[0];
        if (x) {
            return x;
        }
        const l = ro(u);
        return { name: RN[l], color: RC[l] };
    };
    // 가장 높은 계급의 역할 (등급이 같으면 목록에서 더 위에 있는 역할)
    const trole = u => {
        const l = urs(u);
        if (!l.length) {
            return null;
        }
        return l.reduce((a, r) => {
            return RANK[r.level] > RANK[a.level] ? r : a;
        }, l[0]);
    };
    // 닉네임 색 = 가장 위 역할의 색 (역할이 없으면 기본색)
    const ncol = u => {
        return urs(u)[0]?.color || '';
    };
    // 가진 역할 배지 전부
    const rbadges = u => {
        const own = ro(u) === 'owner' ? [{ name: RN.owner, color: RC.owner }] : [];
        const all = [...own, ...urs(u)];
        return (all.length ? all : [rinfo(u)]).map(x => {
            return `<span class=rl style="background:${esc(x.color)}">${esc(x.name)}</span>`;
        }).join(' ');
    };
    const rank = u => {
        return RANK[ro(u)];
    };
    // ---- 채널 권한: 역할 키 = 커스텀 역할 id 또는 '_member' 등 기본 등급. 관리자 이상은 항상 가능 ----
    const rk = u => { const x = urs(u).map(r => r.id); return x.length ? x : ['_' + ro(u)]; };
    const canView = (u, c) => !c ? false : (rank(u) >= 2 || c.viewAll !== false || rk(u).some(k => (c.viewRoles || []).includes(k)));
    const canPost = (u, c) => !c ? false : canView(u, c) && (rank(u) >= 2 || c.sendAll !== false || rk(u).some(k => (c.sendRoles || []).includes(k)));
    const vchans = () => chans.filter(c => canView(me, c));
    let rolesLoaded = false;
    let chansLoaded = false;
    const toast = t => { const d = document.createElement('div'); d.className = 'ts'; d.textContent = t; document.body.append(d); setTimeout(() => {
        return d.remove();
    }, 2500); };
    const av = (u, s) => {
        return u.avatar ? `<img class=av style="width:${s}px;height:${s}px" src="${u.avatar}">` : `<span class=av style="width:${s}px;height:${s}px;background:hsl(${[...u.nick].reduce((a, c) => {
            return a + c.charCodeAt(0) * 7;
        }, 0) % 360},50%,45%);font-size:${s * .45}px">${esc([...u.nick][0])}</span>`;
    };
    const dn = u => {
        const b = u.alias || u.nick;
        if (b.startsWith('[')) {
            return b;
        }
        const x = trole(u);
        return x ? '[' + x.name + '] ' + b : b;
    };
    const pun = u => { const p = u?.punish; return p && (p.until === 0 || p.until > Date.now()) ? p : null; };
    const isOn = u => {
        return u.online && Date.now() - (u.seen || 0) < 90000;
    };
    // ---- 알림음 ----
    let ac;

    function ding() { if (!sound) {
        return;

    function shrink(file, maxH, q, sq) { return new Promise((ok, no) => { const i = new Image(); i.onload = () => { const c = document.createElement('canvas'); const x = c.getContext('2d'); if (sq) {
        c.width = c.height = maxH;
        const m = Math.min(i.width, i.height);
        x.drawImage(i, (i.width - m) / 2, (i.height - m) / 2, m, m, 0, 0, maxH, maxH);
    }
    else {

    // ---- 이미지 (ImgBB) ----
    async function uploadImg(file) {
        if (!IMGBB_KEY || IMGBB_KEY === 'YOUR_IMGBB_API_KEY') { throw { code: 'no-key', message: 'ImgBB API 키가 설정되지 않았습니다' }; }

        catch (e) {

    // ---- 중복 파일명 처리: 1.png → 1(1).png → 1(2).png ----
    // 'imgnames' 컬렉션에 업로드된 파일명을 기록하고, 트랜잭션으로 겹치지 않는 이름을 확보
    async function uniqueName(fn) {
        const m = fn.match(/^(.*?)(\.[^.]*)?$/);
        const base = m[1] || 'image';
        const ext = m[2] || '';
        for (let i = 0; i < 1000; i++) {
            const name = i ? `${base}(${i})${ext}` : base + ext;
            const ref = db.collection('imgnames').doc('i_' + encodeURIComponent(name.toLowerCase()).replace(/\./g, '%2E'));
            try {
                await db.runTransaction(async (t) => {
                    const d = await t.get(ref);
                    if (d.exists) { throw new Error('dup'); }
                    t.set(ref, { name, ts: Date.now() });
                });
                return { name, ref };
            }
            catch (e) {
                if (e.message !== 'dup') { throw e; }
            }
        }
        throw { code: 'no-name', message: '사용 가능한 파일 이름을 찾지 못했습니다' };
    }
    // ---- 저장 공간 부족 시 가장 오래된 메시지부터 10개씩 삭제 후 재시도 ----
    async function prune() {
        const s = await db.collection('msgs').orderBy('ts').limit(10).get();
        if (s.empty) {
            return 0;
        }
        const b = db.batch();
        s.forEach(d => {
            return b.delete(d.ref);
        });
        await b.commit();
        return s.size;
    }

    async function safeAdd(col, data) {
        let removed = 0;
        for (let i = 0; i < 20; i++) {
            try {
                const r = await db.collection(col).add(data);
                if (removed) {
                    toast(`저장 공간 부족: 오래된 메시지 ${removed}개를 삭제했습니다`);
                }
                return r;
            }
            catch (e) {
                if (e.code !== 'resource-exhausted') {
                    throw e;
                }
                const n = await prune();
                if (!n) {
                    throw e;
                }
                removed += n;
            }
        }
        return await db.collection(col).add(data);
    }

    // ---- 링크 미리보기 (키 없는 무료 서비스를 순서대로 조회, 결과는 이 기기에 캐시) ----
    const URL_RE = /https?:\/\/[^\s]+/g;
    const trimRawUrl = u => u.replace(/[.,!?:)\]'"<>]+$/, '');
    const LPK = 'lpc1';
    let lpc = {};
    try { lpc = JSON.parse(localStorage[LPK] || '{}'); } catch { }
    const lpBusy = new Set();
    const lpFail = new Set();
    const lpSave = () => {
        const k = Object.keys(lpc);
        if (k.length > 200) {
            k.slice(0, k.length - 200).forEach(x => { delete lpc[x]; });
        }
        try { localStorage[LPK] = JSON.stringify(lpc); } catch { }
    };
    const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
    const isImgUrl = u => { try { const x = new URL(u); return /\.(png|jpe?g|gif|webp|bmp|avif)$/i.test(x.pathname) || x.hostname === 'i.ibb.co'; } catch { return false; } };
    const httpOnly = u => /^https?:\/\//i.test(u || '') ? u : '';

    function lpHtml(url) {
        const host = hostOf(url);
        if (!host) {
            return '';
        }
        const a = `<a class=lp data-u="${esc(url)}" href="${esc(url)}" target=_blank rel="noopener noreferrer nofollow">`;
        if (isImgUrl(url)) {
            return a.replace('class=lp', 'class="lp lpimg"') + `<img class=lpi loading=lazy referrerpolicy=no-referrer src="${esc(url)}" onerror="this.closest('a').remove()"></a>`;
        }

        }

        return `${a}<img class=lpth loading=lazy referrerpolicy=no-referrer src="${esc(th)}" onerror="this.style.visibility='hidden'"><div class=lpb><div class=lpti>${esc(d?.t || host)}</div><div class=lpds>${esc(host)}${d?.ds ? ' · ' + esc(d.ds) : ''}</div></div></a>`;

    // HTML에서 OG/Twitter 메타태그를 읽어 미리보기 데이터로 변환 (DOMParser는 스크립트·이미지를 실행/로드하지 않음)
    function ogParse(html, url) {
        const d = new DOMParser().parseFromString(html, 'text/html');
        const m = (...names) => {
            for (const n of names) {
                const v = d.querySelector(`meta[property="${n}"],meta[name="${n}"]`)?.getAttribute('content');
                if (v && v.trim()) {
                    return v.trim();
                }
            }
            return '';
        };
        const abs = u => { try { return u ? new URL(u, url).href : ''; } catch { return ''; } };
        return { t: m('og:title', 'twitter:title') || (d.title || '').trim(), ds: m('og:description', 'twitter:description', 'description'), im: abs(m('og:image', 'twitter:image')), lg: abs(d.querySelector('link[rel~="icon"]')?.getAttribute('href')) };
    }

    // 키 없이 쓸 수 있는 무료 서비스를 순서대로 시도 (하나가 막히거나 한도가 차면 다음으로)
    // 'dead' = 서비스 장애/한도 초과, 'miss' = 서비스는 응답했지만 이 페이지의 정보 없음
    const getJson = async (u, sig) => {
        let r;
        try { r = await fetch(u, { signal: sig }); } catch { throw 'dead'; }
        if (!r.ok) { throw (r.status === 429 || r.status >= 500 || r.status === 403 ? 'dead' : 'miss'); }
        try { return await r.json(); } catch { throw 'miss'; }
    };
    const getHtml = async (u, sig, url) => {
        let r;
        try { r = await fetch(u, { signal: sig }); } catch { throw 'dead'; }
        if (!r.ok) { throw (r.status === 429 || r.status >= 500 || r.status === 403 ? 'dead' : 'miss'); }
        return ogParse((await r.text()).slice(0, 600000), url);
    };
    const LP_SRC = [
        { n: 'dub', f: async (url, sig) => {
            const j = await getJson('https://api.dub.co/metatags?url=' + encodeURIComponent(url), sig);
            return { t: j.title || '', ds: j.description || '', im: j.image || '', lg: '' };
        } },
        { n: 'allorigins', f: (url, sig) => { return getHtml('https://api.allorigins.win/raw?url=' + encodeURIComponent(url), sig, url); } },
        { n: 'codetabs', f: (url, sig) => { return getHtml('https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(url), sig, url); } },
        { n: 'microlink', f: async (url, sig) => {
            const j = await getJson('https://api.microlink.io/?url=' + encodeURIComponent(url), sig);
            const x = j?.data || {};
            return { t: x.title || '', ds: x.description || '', im: x.image?.url || '', lg: x.logo?.url || '' };
        } }
    ];
    const lpDead = {};

    async function lpFetch(url) {
        if (lpBusy.has(url)) {
            return;
        }
        lpBusy.add(url);
        let answered = false;
        let got = null;
        for (const src of LP_SRC) {
            if (lpDead[src.n] && Date.now() < lpDead[src.n]) {
                continue;
            }
            const ctl = new AbortController();
            const tm = setTimeout(() => { ctl.abort(); }, 7000);
            try {
                const d = await src.f(url, ctl.signal);
                answered = true;
                if (d && (d.t || d.ds || d.im)) {
                    got = d;
                    break;
                }
            }
            catch (e) {
                if (e === 'miss') {
                    answered = true;
                }
                else {
                    lpDead[src.n] = Date.now() + 120000;
                }
            }
            clearTimeout(tm);
        }
        if (got || answered) {
            lpc[url] = got ? { t: String(got.t || '').slice(0, 120), ds: String(got.ds || '').slice(0, 200), im: got.im || '', lg: got.lg || '' } : {};
            lpSave();
            document.querySelectorAll('a.lp').forEach(e => {
                if (e.dataset.u === url) {
                    e.outerHTML = lpHtml(url);
                }
            });
        }
        else {
            lpFail.add(url);
        }
        lpBusy.delete(url);
    }

    // 메시지의 첫 번째 링크 하나만 미리보기 (스포일러가 있으면 생략)
    function lpOf(m) {
        if (!m.text || m.text.includes('||')) {
            return '';
        }
        const u = (m.text.match(URL_RE) || [])[0];
        return u ? lpHtml(trimRawUrl(u)) : '';
    }

    // ---- 로컬 저장소 (IndexedDB): 텍스트·이미지를 최대 1GB까지 저장, 초과 시 가장 오래된 것부터 삭제 ----
    const CACHE_MAX = 1024 * 1024 * 1024;
    let cdb = null;
    let cbytes = 0;
    let cq = Promise.resolve();
    let hist = {};
    let live = [];
    let histReady = Promise.resolve();
    const imgObj = {};
    const imgBusy = new Set();
    const imgFail = new Set();
    const imgQ = [];
    let imgRun = 0;
    const rq = r => new Promise((ok, no) => { r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
    const txd = t => new Promise((ok, no) => { t.oncomplete = ok; t.onerror = () => no(t.error); t.onabort = () => no(t.error); });
    const cenq = f => { cq = cq.then(f).catch(() => { }); return cq; };
    const fmtMB = n => (n / 1048576).toFixed(n < 1048576 * 10 ? 1 : 0) + 'MB';

    function cacheInit() {
        return new Promise(ok => {
            try {
                const r = indexedDB.open('fsb-cache', 1);
                r.onupgradeneeded = () => {
                    const d = r.result;
                    d.createObjectStore('txt', { keyPath: 'k' });
                    d.createObjectStore('img', { keyPath: 'k' });
                    d.createObjectStore('idx', { keyPath: 'k' }).createIndex('ts', 'ts');
                };
                r.onsuccess = async () => {
                    cdb = r.result;
                    try {
                        navigator.storage?.persist?.();
                        const t = cdb.transaction(['idx', 'txt'], 'readonly');
                        const [all, ms] = await Promise.all([rq(t.objectStore('idx').getAll()), rq(t.objectStore('txt').getAll())]);
                        cbytes = all.reduce((a, x) => a + x.size, 0);
                        ms.forEach(x => { hist[x.m.id] = x.m; });
                    }
                    catch { }
                    ok();
                };
                r.onerror = () => ok();
                r.onblocked = () => ok();
            }
            catch {
                ok();
            }
        });
    }

    // 가장 오래된 것부터 지워서 총 용량이 target 이하가 되게 함
    async function evictTo(target) {
        let gone = 0;
        while (cbytes > target) {
            const t = cdb.transaction(['idx', 'txt', 'img'], 'readwrite');
            const ix = t.objectStore('idx');
            const rows = await rq(ix.index('ts').getAll(null, 50));
            if (!rows.length) {
                cbytes = 0;
                break;
            }
            for (const r of rows) {
                if (cbytes <= target) {
                    break;
                }
                const txt = r.k[0] === 'm';
                ix.delete(r.k);
                t.objectStore(txt ? 'txt' : 'img').delete(r.k);
                cbytes -= r.size;
                if (txt) {
                    delete hist[r.k.slice(2)];
                    gone++;
                }
                else {
                    delete imgObj[r.k.slice(2)];
                    imgFail.add(r.k.slice(2));
                }
            }
            await txd(t);
        }
        if (gone) {
            rebuild();
        }
    }

    function cachePut(store, k, ts, size, val) {
        if (!cdb) {
            return;
        }
        cenq(async () => {
            const put = async () => {
                const t = cdb.transaction(['idx', store], 'readwrite');
                const ix = t.objectStore('idx');
                const old = await rq(ix.get(k));
                ix.put({ k, ts, size });
                t.objectStore(store).put(store === 'txt' ? { k, m: val } : { k, blob: val });
                await txd(t);
                cbytes += size - (old ? old.size : 0);
            };
            try {
                await put();
            }
            catch {
                try {
                    await evictTo(Math.max(0, cbytes - Math.max(size * 2, 20 * 1048576)));
                    await put();
                }
                catch { }
            }
            await evictTo(CACHE_MAX);
        });
    }

    function cacheDel(k) {
        if (!cdb) {
            return;
        }
        cenq(async () => {
            const t = cdb.transaction(['idx', 'txt', 'img'], 'readwrite');
            const ix = t.objectStore('idx');
            const o = await rq(ix.get(k));
            if (!o) {
                return;
            }
            ix.delete(k);
            t.objectStore(k[0] === 'm' ? 'txt' : 'img').delete(k);
            await txd(t);
            cbytes -= o.size;
        });
    }

    const cacheMsg = m => {
        cachePut('txt', 'm:' + m.id, m.ts, new TextEncoder().encode(JSON.stringify(m)).length + 64, m);
    };

    async function cacheClear() {
        if (!cdb) {
            return;
        }
        await cenq(async () => {
            const t = cdb.transaction(['idx', 'txt', 'img'], 'readwrite');
            ['idx', 'txt', 'img'].forEach(s => { t.objectStore(s).clear(); });
            await txd(t);
            cbytes = 0;
        });
        hist = {};
        Object.keys(imgObj).forEach(k => { delete imgObj[k]; });
        imgFail.clear();
        rebuild();
    }

    // 서버의 최근 메시지(live) + 로컬에만 남아 있는 더 오래된 메시지(hist)를 합쳐서 표시
    function rebuild() {
        const ids = new Set(live.map(m => m.id));
        const minTs = live.length ? live[0].ts : Infinity;
        msgs = [...Object.values(hist).filter(m => !ids.has(m.id) && m.ts < minTs).sort((a, b) => a.ts - b.ts), ...live];
        if (me) {
            renderTree();
            renderMsgs();
        }
    }

    // 이미지를 로컬에 내려받아 저장 (동시 3개, 최신 것 먼저)
    function ensureImg(url, ts) {
        if (!cdb || !url || imgObj[url] || imgBusy.has(url) || imgFail.has(url)) {
            return;
        }
        imgBusy.add(url);
        imgQ.push([url, ts]);
        pumpImg();
    }

    function pumpImg() {
        while (imgRun < 3 && imgQ.length) {
            const [url, ts] = imgQ.pop();
            imgRun++;
            loadImg(url, ts).finally(() => {
                imgRun--;
                imgBusy.delete(url);
                pumpImg();
            });
        }
    }

    async function loadImg(url, ts) {
        try {
            const k = 'i:' + url;
            const row = await rq(cdb.transaction('img', 'readonly').objectStore('img').get(k));
            let blob = row?.blob;
            if (!blob) {
                const r = await fetch(url, { mode: 'cors' });
                if (!r.ok) {
                    throw 0;
                }
                blob = await r.blob();
                if (!blob.type.startsWith('image/')) {
                    throw 0;
                }
                cachePut('img', k, ts, blob.size, blob);
            }
            imgObj[url] = URL.createObjectURL(blob);
            document.querySelectorAll('img.mi').forEach(i => {
                if (i.dataset.u === url) {
                    i.src = imgObj[url];
                }
            });
        }
        catch {
            imgFail.add(url);
        }
    }

    function boot() {

        auth.languageCode = 'ko';
        auth.onAuthStateChanged(u => {

                return;

            if (!u) {
                // 예전 방식(닉네임)으로 접속하던 기기는 계정 이전 화면부터 보여줌
                // 이미 로그인 화면이 떠 있으면(가입 실패 후 롤백 등) 입력 중인 내용을 지우지 않도록 다시 그리지 않음

    // 로그인된 Auth 사용자에 연결된 users 문서를 찾아 시작
    async function enter(user) {
        try {
            const s = await db.collection('users').where('authUid', '==', user.uid).limit(1).get();
            if (s.empty) {
                authBusy = true;
                try { await auth.signOut(); } catch { }
                authBusy = false;
                toast('이 이메일에 연결된 프로필이 없습니다. 새 계정 만들기 또는 기존 계정 이전을 이용하세요');
                return loginUI('login');
            }
            const d = s.docs[0];
            claimNick(d.data().nick, d.id).catch(() => { });
            localStorage.removeItem('uid');
            start(d.id);
        }
        catch (e) {
            toast('연결 오류, 재시도 중…');
            setTimeout(() => { enter(user); }, 3000);
        }
    }

        ${mode !== 'login' ? '<input id=lp2 type=password placeholder="비밀번호 확인" maxlength=64>' : ''}
        <label style="display:flex;gap:6px;align-items:center;font-size:13px;color:#b5bac1;cursor:pointer"><input type=checkbox id=la ${localStorage.autoLogin === '0' ? '' : 'checked'} style="width:auto"> 자동 로그인 (이 기기에서 로그인 상태 유지)</label>

        <div style="font-size:12px;color:#949ba4">${hint}</div></div></div>`;
        $('#le').value = keepE ?? '';

        }

        const rs = $('#lreset');

            rs.onclick = async () => {

                if (!EMAIL_RE.test(email)) {
                    return toast('이메일을 입력하세요');
                }
                try {
                    await auth.sendPasswordResetEmail(email);
                    toast('재설정 메일을 보냈습니다 (스팸함도 확인하세요)');
                }
                catch (e) {
                    toast(authMsg(e));
                }
            };
        }
        const bad = m => { throw { msg: m }; };
        const run = async () => {
            const email = $('#le').value.trim();
            const pw = $('#lp').value;
            if (!EMAIL_RE.test(email)) {
                bad('올바른 이메일을 입력하세요');
            }
            if (mode === 'login') {
                if (!pw) {
                    bad('비밀번호를 입력하세요');
                }
                return (await auth.signInWithEmailAndPassword(email, pw)).user;
            }
            const n = $('#ln').value.trim().replace(/\s+/g, '_');
            if (!n) {
                bad(mode === 'new' ? '닉네임을 입력하세요' : '기존 닉네임을 입력하세요');
            }
            if (pw.length < 6) {
                bad('비밀번호는 6자 이상이어야 합니다');
            }
            if (pw !== $('#lp2').value) {
                bad('비밀번호 확인이 일치하지 않습니다');
            }
            if (mode === 'new') {
                if (['everyone', 'here'].includes(n.toLowerCase())) {
                    bad('사용할 수 없는 닉네임입니다');
                }
                const cred = await auth.createUserWithEmailAndPassword(email, pw);
                let claimed = false;
                try {
                    const all = await db.collection('users').get();
                    if (all.docs.some(d => { return d.data().nick.toLowerCase() === n.toLowerCase(); })) {
                        bad('이미 등록된 닉네임입니다');
                    }
                    const ref = db.collection('users').doc();
                    try {
                        await claimNick(n, ref.id);
                        claimed = true;
                    }
                    catch {
                        bad('이미 등록된 닉네임입니다');
                    }
                    const alias = $('#ld').value.trim();
                    await ref.set({ nick: n, alias, avatar: '', role: n.toLowerCase() === OWNER ? 'owner' : 'member', online: true, seen: Date.now(), created: Date.now(), authUid: cred.user.uid });
                    localStorage.lastNick = n;
                    localStorage.lastAlias = alias;
                    cred.user.sendEmailVerification().catch(() => { });
                    return cred.user;
                }
                catch (e) {
                    // 실패하면 방금 만든 Auth 계정과 닉네임 예약을 되돌림
                    if (claimed) {
                        db.collection('nicks').doc(nk(n)).delete().catch(() => { });
                    }
                    await cred.user.delete().catch(() => { });
                    throw e;
                }
            }
            // ---- 기존 닉네임 계정 → 이메일 계정 이전 ----
            const old = $('#lo').value;
            if (!old) {
                bad('기존 비밀번호를 입력하세요');
            }
            const cred = await auth.createUserWithEmailAndPassword(email, pw);
            try {
                const all = await db.collection('users').get();
                const ex = all.docs.find(d => { return d.data().nick.toLowerCase() === n.toLowerCase(); });
                if (!ex) {
                    bad('존재하지 않는 계정입니다');
                }
                const u = ex.data();
                if (u.authUid) {
                    bad('이미 이메일로 이전된 계정입니다. 로그인 탭에서 이메일로 로그인하세요');
                }
                if (u.pwHash && await hpw(old, u.pwSalt) !== u.pwHash) {
                    bad('기존 비밀번호가 올바르지 않습니다');
                }
                const FV = firebase.firestore.FieldValue;
                // users 문서 ID는 그대로 두고 authUid만 연결 (동시에 두 번 이전되지 않도록 트랜잭션 사용)
                await db.runTransaction(async (t) => {
                    const s = await t.get(ex.ref);
                    if (s.data().authUid) {
                        bad('이미 이메일로 이전된 계정입니다');
                    }
                    t.update(ex.ref, { authUid: cred.user.uid, pwHash: FV.delete(), pwSalt: FV.delete() });
                });
                localStorage.lastNick = u.nick;
                localStorage.lastAlias = u.alias || '';
                cred.user.sendEmailVerification().catch(() => { });
                toast('이메일 계정으로 이전되었습니다. 인증 메일을 확인해 주세요');
                return cred.user;
            }
            catch (e) {
                await cred.user.delete().catch(() => { });
                throw e;
            }
        };
        const btn = $('#lok');
        btn.onclick = async () => {
            if (btn.disabled) {
                return;
            }
            btn.disabled = true;
            authBusy = true;
            let user = null;
            try {
                // 자동 로그인: 체크하면 브라우저를 닫아도 로그인 유지(LOCAL), 해제하면 탭을 닫을 때 로그아웃(SESSION)
                const keep = $('#la') ? $('#la').checked : true;
                localStorage.autoLogin = keep ? '1' : '0';
                try {
                    await auth.setPersistence(keep ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
                }
                catch { }
                user = await run();
            }
            catch (e) {
                toast(e?.msg || authMsg(e));
            }
            authBusy = false;
            btn.disabled = false;
            if (user) {
                enter(user);
            }
        };
    }

                if (want && ntOn()) {
                    ntNotify(m, isM);

    // ---- WebRTC 음성방 (Firestore 시그널링, 별도 자체 서버 없음) ----
    const voiceRoomRef = roomId => db.collection('voiceRooms').doc(roomId);
    async function joinVoiceRoom(roomId) {
        if (!roomId || voiceRoomId) return;
        const ch = chans.find(c => c.id === roomId);
        if (!ch || ch.type !== 'voice') return toast('통화방을 찾을 수 없습니다');
        if (!canView(me, ch)) return toast('이 통화방을 볼 권한이 없습니다');
        try {
            try {
                voiceRaw = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false, channelCount: 1 }, video: false });
            } catch (e) {
                // 마이크가 없거나 인식되지 않으면 듣기 전용으로 참가
                if (e?.name === 'NotFoundError' || e?.name === 'OverconstrainedError') {
                    voiceRaw = null;
                    toast('마이크를 찾지 못해 듣기 전용으로 참가합니다');
                }
                else {
                    throw e;
                }
            }
            if (voiceRaw) {
                try {
                    voiceFx = VoiceFX.create(voiceRaw, { remoteLevel: () => Math.max(0, ...Object.values(voicePeers).map(p => p.an ? VoiceFX.rms(p.an) : 0)) });
                    voiceCtx = voiceFx.ctx;
                    voiceStream = voiceFx.stream;
                } catch (e) { console.warn('VoiceFX 사용 불가, 원본 마이크 사용', e); voiceStream = voiceRaw; }
            }
            voiceRoomId = roomId;
            voiceMuted = false;
            voicePeerDocs = {};
            voiceJoinedAt = Date.now();
            const room = voiceRoomRef(roomId);
            // 예전 통화에서 남은 신호(offer/candidate)가 겹쳐 연결되면 소리가 중복되어 울리므로 먼저 지움
            try { const old = await room.collection('signals').where('to', '==', me.id).get(); const ob = db.batch(); old.docs.forEach(d => ob.delete(d.ref)); await ob.commit(); } catch {}
            await room.collection('participants').doc(me.id).set({ uid: me.id, nick: dn(me), joinedAt: voiceJoinedAt, seen: Date.now() });
            // 접속 표시 갱신 (비정상 종료로 남은 유령 참가자를 걸러내기 위함)
            voiceBeat = setInterval(() => { if (voiceRoomId) { voiceRoomRef(voiceRoomId).collection('participants').doc(me.id).update({ seen: Date.now() }).catch(() => {}); } }, 15000);
            voicePeerUnsub = room.collection('participants').onSnapshot(snap => {
                const next = {};
                snap.forEach(d => { const v = d.data(); if (d.id === me.id || Date.now() - (v.seen || v.joinedAt || 0) < VOICE_STALE) { next[d.id] = v; } });
                voicePeerDocs = next;
                Object.keys(next).filter(uid => uid !== me.id).forEach(uid => ensureVoicePeer(uid, next[uid]));
                Object.keys(voicePeers).filter(uid => !next[uid]).forEach(uid => closeVoicePeer(uid));
                renderAll();
            }, err => toast('통화 참가자 목록 오류: ' + (err.message || err)));
            voiceSignalUnsub = room.collection('signals').where('to', '==', me.id).onSnapshot(snap => {
                snap.docChanges().forEach(change => {
                    if (change.type !== 'added') return;
                    const sig = { id: change.doc.id, ...change.doc.data() };
                    if ((sig.ts || 0) < voiceJoinedAt - 3000) { change.doc.ref.delete().catch(() => {}); return; }
                    if (voiceProcessingSignals.has(sig.id)) return;
                    voiceProcessingSignals.add(sig.id);
                    handleVoiceSignal(sig).catch(err => console.warn('voice signal', err));
                });
            }, err => toast('통화 연결 신호 오류: ' + (err.message || err)));
            renderAll();
        } catch (err) {
            await leaveVoiceRoom();
            toast(err?.name === 'NotAllowedError' ? '마이크 권한을 허용해 주세요' : err?.name === 'NotReadableError' ? '마이크가 다른 프로그램에서 사용 중입니다' : '통화 참가 실패: ' + (err?.message || err));
        }
    }
    // ===== VoiceFX: 외부 파일 없이 내장된 WebRTC 음성 개선 모듈 =====
    // 마이크 처리: 저음 잡음 제거(하이패스) → 고음 쉬쉬 소리 제거(로우패스) → 음성 대역 보정(EQ)
    //            → 컴프레서(볼륨 고르게) → 노이즈 게이트(작은 소리/에코 차단) → 리미터(터짐 방지)
    // 전송 품질: Opus 코덱 설정(FEC·모노·비트레이트) + 송신 비트레이트 지정
    const VoiceFX = (() => {
        const rms = an => { const b = new Float32Array(an.fftSize); an.getFloatTimeDomainData(b); let t = 0; for (let i = 0; i < b.length; i++) t += b[i] * b[i]; return Math.sqrt(t / b.length); };
        const node = (ctx, type, set) => { const n = ctx[type](); Object.keys(set || {}).forEach(k => { if (n[k] && n[k].value !== undefined) { n[k].value = set[k]; } else { n[k] = set[k]; } }); return n; };
        // opts.remoteLevel(): 현재 상대 소리의 크기 (0~1). 상대가 말하는 중에는 게이트를 더 엄격하게 적용해 되먹임을 차단
        function create(raw, opts = {}) {
            const o = Object.assign({ openTh: 0.015, duckTh: 0.06, remoteTh: 0.01, hold: 250, remoteLevel: () => 0 }, opts);
            const ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
            ctx.resume().catch(() => {});
            const src = ctx.createMediaStreamSource(raw);
            const hp = node(ctx, 'createBiquadFilter', { type: 'highpass', frequency: 100, Q: 0.7 });
            const lp = node(ctx, 'createBiquadFilter', { type: 'lowpass', frequency: 7800, Q: 0.7 });
            const pres = node(ctx, 'createBiquadFilter', { type: 'peaking', frequency: 2800, Q: 0.9, gain: 2.5 });
            const comp = node(ctx, 'createDynamicsCompressor', { threshold: -26, knee: 24, ratio: 3.5, attack: 0.004, release: 0.2 });
            const makeup = node(ctx, 'createGain', { gain: 1.4 });
            const an = node(ctx, 'createAnalyser', { fftSize: 1024 });
            const gate = node(ctx, 'createGain', { gain: 0 });
            const lim = node(ctx, 'createDynamicsCompressor', { threshold: -3, knee: 0, ratio: 20, attack: 0.001, release: 0.08 });
            const dest = ctx.createMediaStreamDestination();
            src.connect(hp); hp.connect(lp); lp.connect(pres); pres.connect(comp); comp.connect(makeup);
            makeup.connect(an); makeup.connect(gate); gate.connect(lim); lim.connect(dest);
            let holdUntil = 0;
            const timer = setInterval(() => {
                const local = rms(an);
                const th = o.remoteLevel() > o.remoteTh ? o.duckTh : o.openTh;
                const now = Date.now();
                if (local > th) { holdUntil = now + o.hold; }
                gate.gain.setTargetAtTime(now < holdUntil ? 1 : 0, ctx.currentTime, 0.02);
            }, 40);
            return {
                ctx, stream: dest.stream, level: () => rms(an),
                destroy() { clearInterval(timer); try { ctx.close(); } catch {} }
            };
        }
        // 상대 소리 크기 측정기 (재생은 <audio>가 그대로 담당)
        function meter(ctx, stream) {
            const an = ctx.createAnalyser(); an.fftSize = 1024;
            ctx.createMediaStreamSource(stream).connect(an);
            return an;
        }
        // SDP의 Opus 설정 개선: 인밴드 FEC(패킷 손실 복구), 모노, 비트레이트, 10ms 프레임
        function tuneSdp(sdp, kbps = 48) {
            try {
                const m = sdp.match(/a=rtpmap:(\d+) opus\/48000\/2/i);
                if (!m) { return sdp; }
                const pt = m[1];
                const want = { minptime: 10, useinbandfec: 1, usedtx: 0, stereo: 0, 'sprop-stereo': 0, maxaveragebitrate: kbps * 1000, maxplaybackrate: 48000 };
                const re = new RegExp('a=fmtp:' + pt + ' ([^\\r\\n]*)');
                const fm = sdp.match(re);
                const cur = {};
                (fm ? fm[1] : '').split(';').map(x => x.trim()).filter(Boolean).forEach(kv => { const [k, v] = kv.split('='); cur[k] = v; });
                Object.assign(cur, want);
                const line = 'a=fmtp:' + pt + ' ' + Object.keys(cur).map(k => cur[k] === undefined ? k : k + '=' + cur[k]).join(';');
                return fm ? sdp.replace(re, line) : sdp.replace(m[0], m[0] + '\r\n' + line);
            }
            catch { return sdp; }
        }
        // 송신 비트레이트/우선순위 지정
        async function tuneSender(pc, kbps = 48) {
            try {
                for (const sn of pc.getSenders()) {
                    if (sn.track?.kind !== 'audio') { continue; }
                    const p = sn.getParameters();
                    p.encodings = p.encodings && p.encodings.length ? p.encodings : [{}];
                    p.encodings[0].maxBitrate = kbps * 1000;
                    p.encodings[0].priority = 'high';
                    p.encodings[0].networkPriority = 'high';
                    await sn.setParameters(p);
                }
            }
            catch { }
        }
        return { create, meter, tuneSdp, tuneSender, rms };
    })();
    async function ensureVoicePeer(uid, participant) {
        if (!voiceRoomId || voicePeers[uid]) return voicePeers[uid];
        const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        const peer = voicePeers[uid] = { pc, stream: new MediaStream(), audio: null, makingOffer: false, pendingCandidates: [] };
        voiceStream?.getTracks().forEach(track => pc.addTrack(track, voiceStream));
        // 마이크가 없어도 상대 소리는 받을 수 있게 수신 전용 오디오를 추가
        if (!voiceStream) { pc.addTransceiver('audio', { direction: 'recvonly' }); }
        pc.ontrack = ev => {
            const incoming = ev.streams[0] || peer.stream;
            if (!ev.streams[0] && !peer.stream.getTracks().includes(ev.track)) { peer.stream.addTrack(ev.track); }
            if (!peer.audio) {
                peer.audio = document.createElement('audio'); peer.audio.autoplay = true; peer.audio.playsInline = true; peer.audio.style.display = 'none'; document.body.appendChild(peer.audio);
            }
            if (peer.audio.srcObject !== incoming) { peer.audio.srcObject = incoming; }
            if (voiceCtx && !peer.an) { try { peer.an = VoiceFX.meter(voiceCtx, incoming); } catch {} }
            try { ev.receiver.playoutDelayHint = 0; ev.receiver.jitterBufferTarget = 0; } catch {}
            peer.audio.play().catch(() => {});
        };
        pc.onicecandidate = ev => {
            if (ev.candidate && voiceRoomId) voiceRoomRef(voiceRoomId).collection('signals').add({ from: me.id, to: uid, type: 'candidate', candidate: ev.candidate.toJSON(), ts: Date.now() }).catch(() => {});
        };
        pc.onconnectionstatechange = () => { if (['failed', 'closed'].includes(pc.connectionState)) closeVoicePeer(uid); };
        // UID 문자열 순서로 offer 생성자를 하나로 고정해 동시 offer를 피합니다.
        if (String(me.id) < String(uid)) {
            try {
                peer.makingOffer = true;
                const offer = await pc.createOffer(); offer.sdp = VoiceFX.tuneSdp(offer.sdp); await pc.setLocalDescription(offer); VoiceFX.tuneSender(pc);
                await voiceRoomRef(voiceRoomId).collection('signals').add({ from: me.id, to: uid, type: 'offer', sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp }, ts: Date.now() });
            } catch (e) { console.warn('offer error', e); }
            finally { peer.makingOffer = false; }
        }
        return peer;
    }
    async function handleVoiceSignal(sig) {
        if (!voiceRoomId || sig.from === me.id) return;
        const peerInfo = voicePeerDocs[sig.from] || { uid: sig.from, nick: '멤버' };
        if (sig.type === 'offer' && voicePeers[sig.from] && voicePeers[sig.from].pc.remoteDescription) { closeVoicePeer(sig.from); }
        const peer = await ensureVoicePeer(sig.from, peerInfo);
        if (!peer || !peer.pc) return;
        const pc = peer.pc;
        if (sig.type === 'offer') {
            await pc.setRemoteDescription(new RTCSessionDescription(sig.sdp));
            for (const candidate of peer.pendingCandidates.splice(0)) { try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch {} }
            const answer = await pc.createAnswer(); answer.sdp = VoiceFX.tuneSdp(answer.sdp); await pc.setLocalDescription(answer); VoiceFX.tuneSender(pc);
            await voiceRoomRef(voiceRoomId).collection('signals').add({ from: me.id, to: sig.from, type: 'answer', sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp }, ts: Date.now() });
        } else if (sig.type === 'answer') {
            if (pc.signalingState === 'have-local-offer') {
                await pc.setRemoteDescription(new RTCSessionDescription(sig.sdp));
                for (const candidate of peer.pendingCandidates.splice(0)) { try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch {} }
            }
        } else if (sig.type === 'candidate' && sig.candidate) {
            if (!pc.remoteDescription) peer.pendingCandidates.push(sig.candidate);
            else { try { await pc.addIceCandidate(new RTCIceCandidate(sig.candidate)); } catch {} }
        }
        // 처리한 신호는 삭제해 Firestore에 쌓이지 않게 합니다.
        if (voiceRoomId) voiceRoomRef(voiceRoomId).collection('signals').doc(sig.id).delete().catch(() => {});
    }
    function closeVoicePeer(uid) {
        const peer = voicePeers[uid]; if (!peer) return;
        try { peer.pc.ontrack = null; peer.pc.onicecandidate = null; peer.pc.close(); } catch {}
        if (peer.audio) { peer.audio.srcObject = null; peer.audio.remove(); }
        delete voicePeers[uid];
    }
    async function leaveVoiceRoom() {
        const oldRoom = voiceRoomId;
        voiceRoomId = null;
        if (voicePeerUnsub) { voicePeerUnsub(); voicePeerUnsub = null; }
        if (voiceSignalUnsub) { voiceSignalUnsub(); voiceSignalUnsub = null; }
        if (voiceBeat) { clearInterval(voiceBeat); voiceBeat = null; }
        Object.keys(voicePeers).forEach(closeVoicePeer);
        if (voiceFx) { voiceFx.destroy(); voiceFx = null; voiceCtx = null; }
        if (voiceStream) { voiceStream.getTracks().forEach(t => t.stop()); voiceStream = null; }
        if (voiceRaw) { voiceRaw.getTracks().forEach(t => t.stop()); voiceRaw = null; }
        voiceMuted = false; voicePeerDocs = {}; voiceProcessingSignals.clear();
        if (oldRoom && me?.id) {
            try { await voiceRoomRef(oldRoom).collection('participants').doc(me.id).delete(); } catch {}
            try { const rcv = await voiceRoomRef(oldRoom).collection('signals').where('to', '==', me.id).get(); const rb = db.batch(); rcv.docs.forEach(d => rb.delete(d.ref)); await rb.commit(); } catch {}
            try { const sent = await voiceRoomRef(oldRoom).collection('signals').where('from', '==', me.id).get(); const batch = db.batch(); sent.docs.forEach(d => batch.delete(d.ref)); await batch.commit(); } catch {}
        }
    }

    // ---- 사용자 글꼴: 이 기기(IndexedDB)에만 저장. 계정/서버와 무관하므로 기기마다 따로 등록 ----
    let userFontFace = null;
    let userFontName = '';
    const fontDb = () => new Promise((ok, no) => {
        const r = indexedDB.open('fsb-font', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('f'); };
        r.onsuccess = () => ok(r.result);
        r.onerror = () => no(r.error);
    });
    async function fontGet() {
        try {
            const d = await fontDb();
            return await new Promise((ok, no) => { const q = d.transaction('f').objectStore('f').get('user'); q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error); });
        }
        catch { return null; }
    }
    async function fontPut(rec) {
        const d = await fontDb();
        await new Promise((ok, no) => { const t = d.transaction('f', 'readwrite'); t.objectStore('f').put(rec, 'user'); t.oncomplete = ok; t.onerror = () => no(t.error); t.onabort = () => no(t.error); });
    }
    async function fontDel() {
        try {
            const d = await fontDb();
            await new Promise((ok, no) => { const t = d.transaction('f', 'readwrite'); t.objectStore('f').delete('user'); t.oncomplete = ok; t.onerror = () => no(t.error); });
        }
        catch { }
    }
    // FontFace를 만들어 적용. 실패하면 예외 (저장 전에 검증하는 용도로도 사용)
    async function fontApply(rec) {
        let st = document.getElementById('ufs');
        if (!rec) {
            if (userFontFace) { try { document.fonts.delete(userFontFace); } catch { } userFontFace = null; }
            st?.remove();
            userFontName = '';
            return;
        }
        let ff;
        try {
            ff = new FontFace('UserFont', await rec.blob.arrayBuffer());
            await ff.load();
        }
        catch (e1) {
            // 대체 방식: Blob URL로 불러오기 (확장자별 format 힌트 포함)
            const ext = (rec.name.split('.').pop() || '').toLowerCase();
            const fmt = { otf: 'opentype', ttf: 'truetype', woff: 'woff', woff2: 'woff2' }[ext];
            const u = URL.createObjectURL(rec.blob);
            try {
                ff = new FontFace('UserFont', `url("${u}")${fmt ? ` format("${fmt}")` : ''}`);
                await ff.load();
            }
            catch (e2) {
                URL.revokeObjectURL(u);
                throw e1;
            }
        }
        if (userFontFace) { try { document.fonts.delete(userFontFace); } catch { } }
        document.fonts.add(ff);
        userFontFace = ff;
        userFontName = rec.name;
        if (!st) {
            st = document.createElement('style');
            st.id = 'ufs';
            document.head.append(st);
        }
        st.textContent = `html,body{font-family:'UserFont','Korail',system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif !important}`;
    }
    function fontStatus() {
        const el = $('#fst');
        if (el) { el.textContent = userFontName ? '현재 글꼴: ' + userFontName : '기본 글꼴 사용 중'; }
    }
    async function fontInit() {
        const rec = await fontGet();
        if (!rec) { return; }
        try { await fontApply(rec); }
        catch { await fontDel(); }
        fontStatus();
    }
    async function fontUpload(f) {
        if (f.size > 50 * 1024 * 1024) { return toast('글꼴 파일이 너무 큽니다 (최대 50MB)'); }
        const rec = { name: f.name, blob: f, ts: Date.now() };
        try { await fontApply(rec); }
        catch (err) { console.error('font fail', err); return toast('글꼴을 읽지 못했습니다: ' + (err?.message || err?.name || '알 수 없는 오류')); }
        try { await fontPut(rec); toast('글꼴이 적용되었습니다 (이 기기에만 저장)'); }
        catch { toast('글꼴은 적용됐지만 저장에 실패해 새로고침하면 사라집니다'); }
        fontStatus();
    }
    async function fontReset() {
        await fontApply(null);
        await fontDel();
        fontStatus();
        toast('기본 글꼴로 초기화했습니다');
    }

    async function delChan(id) { const s = await db.collection('msgs').where('ch', '==', id).get(); let b = db.batch(); let n = 0; for (const d of s.docs) {
        b.delete(d.ref);
        if (++n % 400 === 0) {
            await b.commit();
            b = db.batch();
        }
    } await b.commit(); await db.collection('chans').doc(id).delete(); }
    boot();

    </script>
